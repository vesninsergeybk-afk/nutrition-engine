name: Nutrition analytics parity smoke

on:
  pull_request:
    paths:
      - 'assets/js/98-analytics-restoration-v6.1.js'
      - 'assets/css/analytics-restoration-v6.1.css'
      - 'tests/analytics-restoration-v6.1.test.js'
      - 'tests/nutrient-source-explorer-v6.1.test.js'
      - 'tests/e2e/analytics-restoration.spec.js'
      - 'assets/js/99-nutrient-source-explorer-v6.1.js'
      - 'index.html'
      - '.github/workflows/analytics-restoration-smoke.yml'
  push:
    branches:
      - 'feature/ration-analytics-restoration-20261009'
    paths:
      - 'assets/js/98-analytics-restoration-v6.1.js'
      - 'assets/css/analytics-restoration-v6.1.css'
      - 'tests/analytics-restoration-v6.1.test.js'
      - 'index.html'
      - '.github/workflows/analytics-restoration-smoke.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify progressive analytics contract
        run: |
          node tests/analytics-restoration-v6.1.test.js
          node tests/nutrient-source-explorer-v6.1.test.js

  browser:
    name: Chromium analytics interaction
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test packages
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise real calculator (virtual local origin)
        run: npx playwright test tests/e2e/analytics-restoration.spec.js --project=chromium --retries=0 --reporter=line
      - name: Keep failed screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-browser-diagnostics
          path: |
            reports/playwright-artifacts/
            reports/playwright-results.json
            reports/playwright-html/
          retention-days: 5
          if-no-files-found: ignore
