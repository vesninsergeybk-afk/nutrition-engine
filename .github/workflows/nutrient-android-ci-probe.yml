name: Nutrient Android CI availability probe

on:
  push:
    branches: [feature/nutrient-android-ci-probe-20261023]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public GitHub-hosted runner
        run: |
          echo "Public GitHub Actions runner available"
          java -version
          python3 --version
