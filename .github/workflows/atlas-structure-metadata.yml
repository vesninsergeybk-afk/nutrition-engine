name: Atlas structure metadata
on:
  push:
    branches: [feature/atlas-structures-20261001]
    paths: [.github/workflows/atlas-structure-metadata.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read pinned GLB structure names
        run: |
          mkdir -p /tmp/atlas-names
          python3 - <<'PY'
          import urllib.request, struct, json, pathlib
          base = 'https://raw.githubusercontent.com/DrMuratAltun/anatomi-simulatoru/37e85dfbbb398e11ba33c8f0e411f06f9bba592f/systems/'
          for name in ['lenf', 'eklem', 'dolasim']:
              data = urllib.request.urlopen(base + name + '.glb', timeout=30).read()
              size = struct.unpack_from('<I', data, 12)[0]
              j = json.loads(data[20:20+size])
              names = [n['name'] for n in j['nodes'] if 'mesh' in n]
              pathlib.Path('/tmp/atlas-names/' + name + '-names.json').write_text(json.dumps(names, ensure_ascii=False, indent=2))
              print(name, len(names), 'structures')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-structure-names
          path: /tmp/atlas-names
          retention-days: 7
