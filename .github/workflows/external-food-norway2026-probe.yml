name: Norway 2026 Source Nutrient Investigation
on:
  push:
    branches: [data-food-wave3-resolution-20261009]
    paths:
      - "tools/probe_norway2026_food_source.py"
      - "tools/crosscheck_norway2026_56_nutrients.py"
      - ".github/workflows/external-food-norway2026-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  norway-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official 2026 Norwegian Food Composition Table
        run: |
          set -euo pipefail
          python3 -m pip install --quiet beautifulsoup4 openpyxl requests
          python3 tools/probe_norway2026_food_source.py \
            --blocked research/external-food-v15/step4e-frozen/step4e_blocked_other.json \
            --out .norway-science
          python3 tools/crosscheck_norway2026_56_nutrients.py \
            --blocked research/external-food-v15/step4e-frozen/step4e_blocked_other.json \
            --out .norway-science
      - uses: actions/upload-artifact@v4
        with:
          name: norway-2026-official-composition-evidence
          path: .norway-science/
          include-hidden-files: true
          retention-days: 21
          if-no-files-found: error
