name: Anatomy model probe

on:
  push:
    branches:
      - feature/muscle-memory-mvp
    paths:
      - .github/workflows/anatomy-model-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download selected benchmark models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/anatomy-probe

          fetch() {
            local name="$1"
            local url="$2"
            local file="/tmp/anatomy-probe/$3"
            echo "::group::$name"
            curl -fL --retry 3 --retry-delay 2 "$url" -o "$file"
            ls -lh "$file"
            stat --printf='bytes=%s\n' "$file"
            sha256sum "$file"
            python3 - "$file" <<'PY'
import pathlib, sys
p = pathlib.Path(sys.argv[1])
head = p.read_bytes()[:12]
print("header_hex=" + head.hex())
print("glb_magic=" + ("yes" if head[:4] == b"glTF" else "no"))
PY
            echo "::endgroup::"
          }

          fetch "Z-Anatomy muscles"             "https://raw.githubusercontent.com/DrMuratAltun/anatomi-simulatoru/37e85dfbbb398e11ba33c8f0e411f06f9bba592f/systems/kas.glb"             "z-anatomy-kas.glb"

          fetch "Z-Anatomy skeleton"             "https://raw.githubusercontent.com/DrMuratAltun/anatomi-simulatoru/37e85dfbbb398e11ba33c8f0e411f06f9bba592f/systems/iskelet.glb"             "z-anatomy-iskelet.glb"

          fetch "Visible Human right arm muscles"             "https://3d.nih.gov/api/submissions/16028/runs/949001c5-c322-4a6e-bfd5-c89b02264de6/output-files/355370"             "visible-human-right-arm.glb"

          fetch "Visible Human left arm muscles"             "https://3d.nih.gov/api/submissions/16026/runs/89f05a36-4f00-4a5c-99a0-2d8c2c2bdc47/output-files/355423"             "visible-human-left-arm.glb"

      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-model-probe
          path: /tmp/anatomy-probe/
          retention-days: 7
          compression-level: 0
