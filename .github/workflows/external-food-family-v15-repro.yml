name: External Food Family v15 Reproducibility Gate

on:
  push:
    branches:
      - data-source-expansion
    paths:
      - "tools/packed/v15/**"
      - "tools/import_external_food_sources.py"
      - "tools/filter_external_food_sources.py"
      - ".github/workflows/external-food-family-v15-repro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-v15:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact audited v15 tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/v15
          cat tools/packed/v15/build_external_food_families_v15.py.gz.b64.part{1,2,3,4}             | base64 -d | gzip -d > .tmp/v15/build_external_food_families_v15.py
          cat tools/packed/v15/audit_external_food_families_v15.py.gz.b64             | base64 -d | gzip -d > .tmp/v15/audit_external_food_families_v15.py

          echo "09174842b338645e94e23ab3bce9071abb2d364dd8c61ea119ebc5af9654e48f  .tmp/v15/build_external_food_families_v15.py" | sha256sum -c -
          echo "02b6247fa58f38ef0855598c8126864bb26b564497e89184a7d2082f252e7a2f  .tmp/v15/audit_external_food_families_v15.py" | sha256sum -c -

      - name: Download official source datasets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/external-food-sources staging/external-food-sources

          curl -L --fail --retry 3 --retry-delay 2             -o .cache/external-food-sources/usda_foundation_2026-04.zip             "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_csv_2026-04-30.zip"

          curl -L --fail --retry 3 --retry-delay 2             -o .cache/external-food-sources/usda_sr_legacy_2018.zip             "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_csv_2018-04.zip"

          curl -L --fail --retry 3 --retry-delay 2             -o .cache/external-food-sources/cnf_2026.zip             "https://open.canada.ca/data/dataset/1b6139bd-ed7e-4043-bc28-ff00e10f3109/resource/019f2a90-e3a9-489d-b6e1-f74f4ba1d006/download/cnf_fcen_all-files-data_2026.zip"

          curl -L --fail --retry 3 --retry-delay 2             -o .cache/external-food-sources/bls_4_0_2025.zip             "https://blsdb.de/assets/uploads/BLS_4_0_2025_DE.zip?token=XZB4-P2AQ-9DM5-IP40-W5Y9-87HT-FMQG-Q3HQ"

      - name: Normalize official data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet openpyxl
          python3 tools/import_external_food_sources.py             --repo .             --usda-foundation .cache/external-food-sources/usda_foundation_2026-04.zip             --usda-sr .cache/external-food-sources/usda_sr_legacy_2018.zip             --cnf .cache/external-food-sources/cnf_2026.zip             --bls .cache/external-food-sources/bls_4_0_2025.zip             --out-dir staging/external-food-sources

      - name: Apply Russian relevance filter
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/filter_external_food_sources.py             --input staging/external-food-sources/external_foods_staging.jsonl             --out-dir staging/external-food-sources

      - name: Build family layer v15
        shell: bash
        run: |
          set -euo pipefail
          python3 .tmp/v15/build_external_food_families_v15.py             --input staging/external-food-sources/external_foods_core_generic.jsonl             --out-dir staging/external-food-sources/v15             | tee staging/external-food-sources/v15-build-console.txt

      - name: Independent semantic audit
        shell: bash
        run: |
          set -euo pipefail
          python3 .tmp/v15/audit_external_food_families_v15.py             --input-core staging/external-food-sources/external_foods_core_generic.jsonl             --members staging/external-food-sources/v15/external_food_family_members.jsonl             --secondary staging/external-food-sources/v15/external_food_family_pass_secondary.jsonl             --report staging/external-food-sources/v15/independent_semantic_audit_v15.json

      - name: Reproducibility assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out = Path("staging/external-food-sources/v15")
          report = json.loads((out/"external_food_family_report.json").read_text())
          audit = json.loads((out/"independent_semantic_audit_v15.json").read_text())

          expected = {
              "input_core_records": 13764,
              "family_eligible_records": 13680,
              "residual_secondary_removed_from_default": 84,
              "navigation_families": 6887,
              "identity_profiles": 8541,
          }
          for key, value in expected.items():
              got = report.get(key)
              assert got == value, f"{key}: got {got}, expected {value}"
          assert audit.get("pass") is True, audit
          assert audit.get("errors") == [], audit
          print("v15 counts and semantic audit reproduced exactly")
          PY

          echo "144db74691f6c08af3405f621d6471289aad6740beb77e519b47949604d31188  staging/external-food-sources/v15/external_food_family_members.jsonl" | sha256sum -c -
          echo "20ea45444e3cefc970ed269db1f5655fb0f77518c43ac22e28842e5cb406e138  staging/external-food-sources/v15/external_food_family_report.json" | sha256sum -c -
          echo "de32d252caafe26bd925e35f731616f2ac016585610625b91ffa8ebe912ddabd  staging/external-food-sources/v15/independent_semantic_audit_v15.json" | sha256sum -c -

      - name: Publish summary
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path("staging/external-food-sources/v15")
          r=json.loads((p/"external_food_family_report.json").read_text())
          a=json.loads((p/"independent_semantic_audit_v15.json").read_text())
          print("## External food family v15 reproducibility")
          print("")
          print(f"- Input core: {r['input_core_records']}")
          print(f"- Family members: {r['family_eligible_records']}")
          print(f"- Secondary: {r['residual_secondary_removed_from_default']}")
          print(f"- Families: {r['navigation_families']}")
          print(f"- Profiles: {r['identity_profiles']}")
          print(f"- Independent audit: {'PASS' if a['pass'] else 'FAIL'}")
          print("- Exact artifact hashes: PASS")
          PY

      - name: Upload reproduced v15 artifact
        uses: actions/upload-artifact@v4
        with:
          name: external-food-family-v15-reproduced
          path: staging/external-food-sources/v15/
          if-no-files-found: error
          retention-days: 14
