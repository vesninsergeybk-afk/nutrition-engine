name: Muscle memory browser smoke

on:
  push:
    branches:
      - feature/muscle-memory-mvp
    paths:
      - experiments/muscle-memory-game/**
      - .github/workflows/muscle-memory-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

# Ordinary pushes run the fast deterministic checks only. The expensive
# Chromium + two-model journey is reserved for explicit checkpoints:
# workflow_dispatch or a commit message containing [full-smoke].
#
# Fast runs use a unique concurrency group, so they never cancel or wait for
# checkpoints. Full-smoke runs share one group: a newer checkpoint supersedes
# an older checkpoint, but ordinary pushes cannot cancel it.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-smoke]')) && 'muscle-memory-full-smoke' || format('muscle-memory-fast-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-smoke]') }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Full-body BodyParts3D is downloaded from the pinned upstream source in the
    # browser test. Cold GitHub runners can legitimately need more than 15 min.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check experiments/muscle-memory-game/app.js
          node --check experiments/muscle-memory-game/anatomy-terms-ru.js
          node --check experiments/muscle-memory-game/quality-lab.js
          node --check experiments/muscle-memory-game/bodyparts4-classification.js
          node --check experiments/muscle-memory-game/bodyparts4-muscles-ru.js
          node --check experiments/muscle-memory-game/learning-engine.js
          node --check experiments/muscle-memory-game/virtual-specimens.js
          node --check experiments/muscle-memory-game/regional-depth-map.js
          node --check experiments/muscle-memory-game/learning-session.js
          node --check experiments/muscle-memory-game/retention-engine.js
          node --check experiments/muscle-memory-game/progress-engine.js
          node --check experiments/muscle-memory-game/check-learning-engine.mjs
          node --check experiments/muscle-memory-game/check-learning-session.mjs
          node --check experiments/muscle-memory-game/check-quiz-ui.mjs
          node --check experiments/muscle-memory-game/check-regional-rendering.mjs
          node --check experiments/muscle-memory-game/check-retention-engine.mjs
          node --check experiments/muscle-memory-game/check-progress-engine.mjs
          node --check experiments/muscle-memory-game/check-learning-cross-source.mjs
          node --check experiments/muscle-memory-game/check-anatomy-validation.mjs
          node --check experiments/muscle-memory-game/check-study-layers.mjs
          node --check experiments/muscle-memory-game/check-virtual-specimens.mjs
          node --check experiments/muscle-memory-game/check-virtual-specimen-coverage.mjs
          node --check experiments/muscle-memory-game/check-specimen-bone-context.mjs
          node --check experiments/muscle-memory-game/check-specimen-clipping.mjs
          node --check experiments/muscle-memory-game/check-regional-performance.mjs
          node --check experiments/muscle-memory-game/check-anatomical-depth.mjs
          node --check experiments/muscle-memory-game/study-layer-terms-ru.js
          node --check experiments/muscle-memory-game/check-z-anatomy-ru.mjs
          node --check experiments/muscle-memory-game/verify.mjs
          node --input-type=module <<'NODE'
          import { bodyPartsAnatomyKind } from './experiments/muscle-memory-game/bodyparts4-classification.js';
          const cases = [
            [{ system: 'skeletal', conceptId: 'FMA24474' }, 'bone', 'right femur'],
            [{ system: 'skeletal', conceptId: 'FMA22544' }, 'muscle', 'right tibialis anterior'],
            [{ system: 'skeletal', conceptId: 'FMA22552' }, 'muscle', 'right fibularis longus'],
            [{ system: 'skeletal', conceptId: 'FMA58776' }, null, 'right iliotibial tract'],
            [{ system: 'muscular', conceptId: 'FMA34682' }, 'muscle', 'deltoid part'],
          ];
          for (const [part, expected, label] of cases) {
            const actual = bodyPartsAnatomyKind(part);
            if (actual !== expected) throw new Error(label + ': expected ' + expected + ', got ' + actual);
          }
          NODE

          node --input-type=module <<'NODE'
          import { bodyPartsAnatomyKind } from './experiments/muscle-memory-game/bodyparts4-classification.js';
          import { bodyPartsMuscleNameRu } from './experiments/muscle-memory-game/bodyparts4-muscles-ru.js';

          const response = await fetch('https://raw.githubusercontent.com/ashemag/human-atlas/1c38bf35c254a891200d3cedecfd57abebe83d8d/public/models/atlas.json');
          if (!response.ok) throw new Error('Could not fetch pinned BodyParts3D atlas');
          const atlas = await response.json();
          const muscles = atlas.parts.filter(part => bodyPartsAnatomyKind(part) === 'muscle');
          const missing = muscles.filter(part => !bodyPartsMuscleNameRu(part.name));
          if (missing.length) {
            throw new Error('Missing Russian muscle names: ' + missing.map(part => part.name).join(', '));
          }
          const latinUserFacing = muscles.filter(part => /[A-Za-z]/.test(bodyPartsMuscleNameRu(part.name) || ''));
          if (latinUserFacing.length) {
            throw new Error(
              'Latin fragments leaked into Russian BodyParts labels: ' +
              latinUserFacing.map(part => part.name + ' -> ' + bodyPartsMuscleNameRu(part.name)).join(' | ')
            );
          }
          if (muscles.length !== 416) {
            throw new Error('Unexpected BodyParts3D muscle count: ' + muscles.length);
          }
          console.log('Russian muscle names:', muscles.length + '/' + muscles.length);
          NODE

          node experiments/muscle-memory-game/check-z-anatomy-ru.mjs
          node experiments/muscle-memory-game/check-learning-engine.mjs
          node experiments/muscle-memory-game/check-learning-session.mjs
          node experiments/muscle-memory-game/check-quiz-ui.mjs
          node experiments/muscle-memory-game/check-regional-rendering.mjs
          node experiments/muscle-memory-game/check-retention-engine.mjs
          node experiments/muscle-memory-game/check-progress-engine.mjs
          node experiments/muscle-memory-game/check-learning-cross-source.mjs
          node experiments/muscle-memory-game/check-anatomy-validation.mjs
          node experiments/muscle-memory-game/check-study-layers.mjs
          node experiments/muscle-memory-game/check-virtual-specimens.mjs
          node experiments/muscle-memory-game/check-virtual-specimen-coverage.mjs
          node experiments/muscle-memory-game/check-specimen-bone-context.mjs
          node experiments/muscle-memory-game/check-specimen-clipping.mjs
          node experiments/muscle-memory-game/check-regional-performance.mjs
          node experiments/muscle-memory-game/check-anatomical-depth.mjs
          node experiments/muscle-memory-game/check-region-depth.mjs
          node experiments/muscle-memory-game/check-deeper-links.mjs

      - name: Install browser
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-smoke]') }}
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify one interface for both anatomy sources
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-smoke]') }}
        shell: bash
        run: |
          python3 -m http.server 4173 --directory experiments/muscle-memory-game >/tmp/muscle-memory-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          cat >/tmp/smoke.cjs <<'NODE'
          const { chromium } = require('/tmp/node_modules/playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];

            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push('console: ' + msg.text());
            });

            await page.goto('http://127.0.0.1:4173/?mode=explore', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(
              () => {
                const loading = document.querySelector('#loading');
                const question = document.querySelector('#question')?.textContent || '';
                return loading?.classList.contains('is-hidden') ||
                  /Не удалось загрузить|Ошибка загрузки/.test((loading?.textContent || '') + ' ' + question);
              },
              null,
              { timeout: 150000 }
            );

            const initialLoadingHidden = await page.locator('#loading').evaluate(
              el => el.classList.contains('is-hidden')
            );
            if (!initialLoadingHidden) {
              throw new Error(
                'Initial model load failed: ' +
                await page.locator('#loading').innerText() +
                ' | ' +
                await page.locator('#diagnostics').innerText() +
                ' | browser errors: ' +
                errors.join(' || ')
              );
            }

            assert.equal(new URL(page.url()).pathname, '/');
            assert.equal(await page.locator('#model-source').inputValue(), 'z-anatomy');
            assert.equal(await page.locator('#viewer').getAttribute('data-model-source'), 'z-anatomy');
            assert.equal(await page.locator('#learning-region').isDisabled(), false);
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-learning-catalog-count')) > 140);
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-learning-target-count')) > 140);
            assert.equal(await page.locator('#learning-controls').isHidden(), true);
            assert.equal(await page.locator('#debug-panel').isHidden(), true);
            assert.equal(await page.locator('#score').isHidden(), true);
            assert.equal(await page.locator('#learning-session-mode').isHidden(), true);
            assert.equal(await page.locator('#model-source option').count(), 2);
            assert.equal(await page.locator('.status-card').count(), 0);
            assert.equal(await page.locator('#focus-shoulder').isHidden(), true);

            const visibleInitialText = await page.locator('body').innerText();
            assert.doesNotMatch(visibleInitialText, /Учебный каталог|треугольник|mesh|FMA\d+/i);

            await page.click('#mode-quiz');
            assert.equal(await page.locator('#learning-controls').isVisible(), true);

            await page.selectOption('#learning-region', 'upper-limb');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-scope'), 'upper-limb');
            assert.ok(
              Number(await page.locator('#viewer').getAttribute('data-learning-target-count')) > 30
            );
            assert.match(await page.locator('#learning-summary').innerText(), /Верхняя конечность/);
            assert.equal(await page.locator('#region-isolation').isChecked(), true);
            assert.equal(await page.locator('#viewer').getAttribute('data-region-isolation'), 'true');
            assert.ok(
              Number(await page.locator('#viewer').getAttribute('data-region-visible-muscles')) >=
              Number(await page.locator('#viewer').getAttribute('data-learning-target-count'))
            );
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-mode'), 'off');
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-scope'), 'regional');
            assert.ok(
              Number(await page.locator('#viewer').getAttribute('data-region-visible-bones')) > 0
            );
            await page.waitForTimeout(350);
            await page.screenshot({
              path: '/tmp/muscle-memory-learning-upper-limb.png',
              fullPage: true,
            });

            await page.selectOption('#learning-region', 'rotator-cuff');
            assert.equal(
              await page.locator('#viewer').getAttribute('data-learning-target-count'),
              '4'
            );
            assert.equal(await page.locator('#learning-session-size').inputValue(), '4');
            assert.match(await page.locator('#learning-session-size option').first().innerText(), /Весь блок.*4/i);

            await page.selectOption('#learning-region', 'neck');
            const neckCount = Number(
              await page.locator('#viewer').getAttribute('data-learning-target-count')
            );
            assert.ok(neckCount >= 8);

            await page.selectOption('#learning-region', 'neck-collar');
            const neckCollarCount = Number(
              await page.locator('#viewer').getAttribute('data-learning-target-count')
            );
            assert.ok(neckCollarCount > neckCount);
            await page.waitForTimeout(350);
            await page.screenshot({
              path: '/tmp/muscle-memory-learning-neck-collar.png',
              fullPage: true,
            });

            await page.selectOption('#learning-region', 'shoulder');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-region'), 'shoulder');
            assert.equal(await page.locator('#focus-shoulder').isVisible(), true);
            assert.equal(
              await page.locator('#viewer').getAttribute('data-learning-target-count'),
              '13'
            );
            assert.match(await page.locator('#learning-summary').innerText(), /Плечевой пояс/);

            await page.selectOption('#learning-region', 'all');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-region'), 'all');

            // Pass 2: finite learning sessions must work as real flows.
            await page.selectOption('#learning-region', 'shoulder');
            await page.selectOption('#learning-session-size', '5');

            // FIND: start, reveal one answer, advance.
            await page.click('[data-learning-mode="find"]');
            await page.click('#start-learning-session');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-mode'), 'find');
            assert.equal(await page.locator('#model-source-field').isHidden(), true);
            assert.equal(await page.locator('.viewer-settings').isHidden(), true);
            assert.equal(await page.locator('.viewer-hint').isHidden(), true);
            assert.equal(await page.locator('.attribution').isHidden(), true);
            assert.equal(await page.locator('#exit-learning-session').isVisible(), true);
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-total'), '5');
            assert.match(await page.locator('#question').innerText(), /Найдите:/);
            await page.click('#show-answer');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-done'), '1');
            assert.match(await page.locator('#session-progress').innerText(), /1 из 5/i);
            let storedLearning = await page.evaluate(() =>
              localStorage.getItem('muscle-memory-learning-v1')
            );
            assert.ok(storedLearning && storedLearning.includes('::find'));

            // Finish the whole five-item session and open its result.
            for (let done = 1; done < 5; done += 1) {
              await page.click('#next-question');
              await page.click('#show-answer');
              assert.equal(
                await page.locator('#viewer').getAttribute('data-learning-session-done'),
                String(done + 1)
              );
            }
            await page.click('#next-question');
            assert.match(await page.locator('#question-label').innerText(), /Сессия завершена/i);
            assert.match(await page.locator('#next-question').innerText(), /Повторить ошибки/);

            // The result screen must start a mistake-review session directly.
            await page.click('#next-question');
            assert.equal(await page.locator('#learning-session-mode').inputValue(), 'mistakes');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-mode'), 'mistakes');
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-learning-session-total')) > 0);
            assert.equal(await page.locator('#exit-learning-session').isVisible(), true);
            await page.click('#exit-learning-session');

            assert.equal(await page.locator('#learning-progress').isVisible(), true);
            await page.locator('#learning-progress > summary').click();
            assert.match(await page.locator('#learning-progress-content').innerText(), /Слабые места|Выбранная область|Плечевой пояс/i);

            // Pass 3: due work is offered as one action, not as a statistics dashboard.
            assert.equal(await page.locator('#today-learning-session').isVisible(), true);
            assert.match(await page.locator('#today-learning-session').innerText(), /Повторить сегодня/i);
            await page.click('#today-learning-session');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-mode'), 'today');
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-learning-session-total')) > 0);
            await page.click('#exit-learning-session');

            // NAME: four smart choices, eventually one must complete the item.
            await page.click('[data-learning-mode="name"]');
            await page.click('#start-learning-session');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-mode'), 'name');
            assert.equal(await page.locator('.name-choice').count(), 4);
            assert.match(await page.locator('#question').innerText(), /Назовите выделенную мышцу/);
            assert.equal(await page.locator('#viewer').getAttribute('data-name-target-visible'), 'true');
            assert.ok(
              Number(await page.locator('#viewer').getAttribute('data-name-target-component-count')) >= 1
            );
            assert.match(
              await page.locator('#viewer').getAttribute('data-name-target-presentation'),
              /^(context|isolated)$/
            );
            const currentTargetId = await page.locator('#viewer').getAttribute('data-learning-current-target-id');
            const wrongChoice = page.locator('.name-choice').filter({ hasNot: page.locator('[data-target-id="' + currentTargetId + '"]') }).first();
            const wrongButtons = page.locator('.name-choice');
            let wrongIndex = -1;
            for (let i = 0; i < await wrongButtons.count(); i += 1) {
              if ((await wrongButtons.nth(i).getAttribute('data-target-id')) !== currentTargetId) {
                wrongIndex = i;
                break;
              }
            }
            assert.ok(wrongIndex >= 0);
            const wrongLabel = await wrongButtons.nth(wrongIndex).innerText();
            const correctLabel = await page.locator(
              '.name-choice[data-target-id="' + currentTargetId + '"]'
            ).innerText();
            await wrongButtons.nth(wrongIndex).click();
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-done'), '0');
            const correctionFeedback = await page.locator('#feedback').innerText();
            assert.ok(correctionFeedback.includes(wrongLabel));
            assert.equal(correctionFeedback.includes(correctLabel), false);
            await page.locator('.name-choice[data-target-id="' + currentTargetId + '"]').click();
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-done'), '1');
            assert.match(await page.locator('#feedback').innerText(), /Верно после коррекции/i);
            storedLearning = await page.evaluate(() =>
              localStorage.getItem('muscle-memory-learning-v1')
            );
            assert.ok(storedLearning && storedLearning.includes('::name'));
            await page.click('#exit-learning-session');

            // Pass 3: due work becomes one direct action, not another dashboard.
            assert.equal(await page.locator('#today-learning-session').isVisible(), true);
            assert.match(await page.locator('#today-learning-session').innerText(), /Повторить сегодня/i);
            assert.equal(await page.locator('#learning-progress').isVisible(), true);
            if (!(await page.locator('#learning-progress').evaluate(el => el.open))) {
              await page.locator('#learning-progress > summary').click();
            }
            assert.match(await page.locator('#learning-progress-content').innerText(), /Найти:|Назвать:/i);
            assert.ok((await page.locator('.progress-confusion').count()) > 0);
            await page.screenshot({ path: '/tmp/muscle-memory-learning-progress.png', fullPage: true });
            await page.locator('.progress-confusion').first().click();
            assert.equal(await page.locator('#mode-explore').getAttribute('aria-pressed'), 'true');
            assert.match(await page.locator('#question-label').innerText(), /Сравнение/i);
            await page.click('#mode-quiz');

            assert.equal(await page.locator('#today-learning-session').isVisible(), true);
            await page.click('#today-learning-session');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-mode'), 'today');
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-learning-session-total')) > 0);
            assert.match(await page.locator('#question-label').innerText(), /На сегодня/i);
            await page.click('#exit-learning-session');

            // PRACTICAL: mixed finite practice, not a duplicate FIND flow.
            await page.click('[data-learning-mode="practical"]');
            await page.click('#start-learning-session');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-mode'), 'practical');
            assert.match(await page.locator('#question-label').innerText(), /Практикум/i);
            assert.match(await page.locator('#session-progress').innerText(), /1 из 5/i);
            for (let done = 0; done < 5; done += 1) {
              await page.click('#show-answer');
              assert.equal(
                await page.locator('#viewer').getAttribute('data-learning-session-done'),
                String(done + 1)
              );
              if (done < 4) await page.click('#next-question');
            }
            const storedAfterPracticalCompletion = await page.evaluate(() =>
              JSON.parse(localStorage.getItem('muscle-memory-learning-v1') || '{}')
            );
            assert.ok(
              (storedAfterPracticalCompletion.sessions || []).some(
                entry => entry.mode === 'practical' && entry.total === 5
              ),
              'Completed session must be in history before the learner opens the summary'
            );
            await page.click('#next-question');
            assert.match(await page.locator('#question-label').innerText(), /Сессия завершена/i);
            await page.screenshot({ path: '/tmp/muscle-memory-learning-summary.png', fullPage: true });

            // CONTROL: one timed attempt, no reveal or layer hint before the answer.
            await page.click('#mode-explore');
            await page.click('#mode-quiz');
            await page.click('[data-learning-mode="exam"]');
            assert.equal(await page.locator('#exam-time-field').isVisible(), true);
            await page.selectOption('#exam-item-seconds', '30');
            await page.click('#start-learning-session');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-mode'), 'exam');
            assert.equal(await page.locator('#show-answer').isHidden(), true);
            assert.equal(await page.locator('#reveal-deeper').isHidden(), true);
            const examSeconds = Number(await page.locator('#viewer').getAttribute('data-exam-seconds'));
            assert.ok(examSeconds > 0 && examSeconds <= 30);
            assert.match(await page.locator('#session-progress').innerText(), /\d+ с/);
            const examSkill = await page.locator('#viewer').getAttribute('data-learning-current-skill');
            if (examSkill === 'find') {
              assert.equal(
                await page.locator('#viewer').getAttribute('data-exam-find-accessible'),
                'true'
              );
            }
            await page.screenshot({ path: '/tmp/muscle-memory-learning-control.png', fullPage: true });
            await page.click('#exit-learning-session');

            // Return to setup before checking the mobile NAME flow.
            await page.click('#mode-explore');
            await page.click('#mode-quiz');

            // Mobile training becomes a task sheet attached to the 3D viewer.
            await page.setViewportSize({ width: 412, height: 915 });
            await page.click('[data-learning-mode="name"]');
            await page.click('#start-learning-session');
            assert.equal(await page.locator('#learning-controls').isHidden(), true);
            assert.equal(await page.locator('.name-choice').count(), 4);
            assert.equal(await page.locator('#viewer').getAttribute('data-name-target-visible'), 'true');
            assert.equal(
              await page.locator('.question-card').evaluate(el => el.parentElement?.classList.contains('viewer-wrap')),
              true
            );
            assert.equal(await page.locator('#score').isHidden(), true);
            assert.equal(await page.locator('.topbar').isHidden(), true);
            assert.equal(await page.locator('.attribution').isHidden(), true);
            assert.match(await page.locator('#session-progress').innerText(), /1 из 5/i);
            await page.screenshot({ path: '/tmp/muscle-memory-learning-mobile-name.png', fullPage: true });

            // Active mobile training intentionally hides the top bar. Exit the
            // session first, then switch to the atlas through the visible mode control.
            await page.click('#exit-learning-session');
            assert.equal(await page.locator('.topbar').isVisible(), true);
            await page.click('#mode-explore');
            assert.equal(
              await page.locator('.question-card').evaluate(el => el.parentElement?.classList.contains('viewer-wrap')),
              true
            );
            assert.equal(await page.locator('#explore-controls').isVisible(), true);
            assert.equal(await page.locator('#structure-search').isVisible(), true);
            await page.screenshot({ path: '/tmp/muscle-memory-atlas-mobile.png', fullPage: true });

            await page.setViewportSize({ width: 1440, height: 1000 });
            assert.equal(await page.locator('#learning-controls').isHidden(), true);

            await page.fill('#structure-search', 'deltoid');
            await page.waitForFunction(
              () => document.querySelectorAll('.search-result').length > 0,
              null,
              { timeout: 15000 }
            );
            assert.ok((await page.locator('.search-result').count()) > 0);
            const zDeltoidLabel = await page.locator('.search-result').first().innerText();
            assert.match(zDeltoidLabel, /Дельтовидн/i);
            assert.match(zDeltoidLabel, /\((справа|слева)\)$/i);
            assert.doesNotMatch(zDeltoidLabel, /deltoid/i);

            // Z-Anatomy has the complete five-target abdominal wall needed for
            // the curated depth profile.
            await page.selectOption('#learning-region', 'abdomen');
            assert.equal(
              await page.locator('#viewer').getAttribute('data-learning-target-count'),
              '5'
            );
            assert.equal(
              await page.locator('#viewer').getAttribute('data-depth-source-capability'),
              'ok'
            );

            // Literal atlas path: select a superficial muscle through the user
            // interface, click the now-centered 3D muscle, follow "Глубже здесь",
            // isolate the linked muscle, then restore the regional specimen.
            await page.selectOption('#view-preset', 'front');
            await page.fill('#structure-search', 'наружная косая');
            await page.waitForFunction(
              () => document.querySelectorAll('.search-result').length > 0,
              null,
              { timeout: 15000 }
            );
            const obliqueResult = page.locator('.search-result').first();
            assert.match(await obliqueResult.innerText(), /Наружная косая/i);
            await obliqueResult.click();
            await page.waitForTimeout(250);

            const viewerBox = await page.locator('#viewer').boundingBox();
            assert.ok(viewerBox && viewerBox.width > 0 && viewerBox.height > 0);
            await page.mouse.click(
              viewerBox.x + viewerBox.width / 2,
              viewerBox.y + viewerBox.height / 2
            );
            await page.waitForFunction(
              () => {
                const panel = document.querySelector('#deeper-structures');
                return panel && !panel.hidden &&
                  document.querySelectorAll('.deeper-structure').length > 0;
              },
              null,
              { timeout: 15000 }
            );
            assert.match(
              await page.locator('#deeper-structures').innerText(),
              /Глубже здесь/i
            );
            assert.ok((await page.locator('.deeper-structure').count()) >= 1);
            await page.locator('.deeper-structure').first().click();
            assert.equal(
              await page.locator('#viewer').getAttribute('data-deeper-focus'),
              'true'
            );
            assert.ok(
              Number(
                await page.locator('#viewer').getAttribute('data-deeper-focus-component-count')
              ) >= 1
            );
            assert.match(
              await page.locator('#isolate-selected').innerText(),
              /Показать окружение/i
            );
            await page.click('#isolate-selected');
            assert.equal(
              await page.locator('#viewer').getAttribute('data-deeper-focus'),
              'false'
            );
            assert.match(
              await page.locator('#isolate-selected').innerText(),
              /Изолировать/i
            );

            await page.selectOption('#learning-region', 'shoulder');

            const pathnameBefore = new URL(page.url()).pathname;
            await page.locator('.viewer-settings > summary').click();
            await page.selectOption('#model-source', 'bodyparts4');

            await page.waitForFunction(
              () =>
                document.querySelector('#loading')?.classList.contains('is-hidden') &&
                document.querySelector('#viewer')?.dataset.modelSource === 'bodyparts4',
              null,
              { timeout: 150000 }
            );

            assert.equal(new URL(page.url()).pathname, pathnameBefore, 'Model switch must not navigate away');
            assert.equal(await page.locator('#model-source').inputValue(), 'bodyparts4');
            assert.equal(await page.locator('#mode-explore').getAttribute('aria-pressed'), 'true');
            assert.equal(await page.locator('#learning-region').isDisabled(), false);
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-learning-catalog-count')) > 140);
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-region'), 'shoulder');
            assert.equal(
              await page.locator('#viewer').getAttribute('data-learning-target-count'),
              '13'
            );
            assert.equal(await page.locator('#region-isolation').isChecked(), true);
            assert.equal(await page.locator('#viewer').getAttribute('data-region-isolation'), 'true');
            assert.equal(await page.locator('#bone-mode').isDisabled(), false);
            assert.equal(await page.locator('#bone-mode').inputValue(), 'off');
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-mode'), 'off');
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-scope'), 'regional');
            const regionalBoneCount = Number(
              await page.locator('#viewer').getAttribute('data-region-visible-bones')
            );
            assert.ok(regionalBoneCount > 0);

            // BodyParts3D is intentionally incomplete for the abdominal muscle
            // wall. It must not present one external-oblique target as a full
            // anatomical depth stack.
            await page.selectOption('#learning-region', 'abdomen');
            assert.equal(
              await page.locator('#viewer').getAttribute('data-learning-target-count'),
              '1'
            );
            assert.equal(
              await page.locator('#viewer').getAttribute('data-depth-source-capability'),
              'source-incomplete'
            );
            assert.equal(await page.locator('#source-coverage-note').isVisible(), true);
            assert.match(
              await page.locator('#source-coverage-note').innerText(),
              /неполон.*1 из 5.*Z-Anatomy/i
            );
            await page.click('#peel-surface-layer');
            assert.match(
              await page.locator('#feedback').innerText(),
              /препарат неполон.*1 из 5/i
            );
            await page.selectOption('#learning-region', 'shoulder');

            // Layer presets operate inside the isolated region.
            assert.equal(await page.locator('#layer-preset').isDisabled(), false);

            await page.selectOption('#layer-preset', 'bones');
            assert.equal(await page.locator('#viewer').getAttribute('data-layer-preset'), 'bones');
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-mode'), 'anatomical');
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-scope'), 'regional');
            assert.equal(await page.locator('#viewer').getAttribute('data-muscle-mode'), 'ghost');
            assert.equal(
              Number(await page.locator('#viewer').getAttribute('data-region-visible-bones')),
              regionalBoneCount
            );
            await page.waitForTimeout(350);
            await page.screenshot({
              path: '/tmp/muscle-memory-bodyparts-shoulder-bones.png',
              fullPage: true,
            });

            await page.selectOption('#layer-preset', 'muscles');
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-mode'), 'off');
            assert.equal(await page.locator('#viewer').getAttribute('data-muscle-mode'), 'anatomical');
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-connective-count')) > 0);
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-skin-count')) > 0);

            await page.selectOption('#layer-preset', 'fascia');
            assert.equal(await page.locator('#viewer').getAttribute('data-layer-preset'), 'fascia');
            assert.equal(await page.locator('#viewer').getAttribute('data-muscle-mode'), 'ghost');
            assert.equal(await page.locator('#connective-mode').inputValue(), 'anatomical');
            assert.equal(
              await page.locator('#viewer').getAttribute('data-connective-visible-layers'),
              'fascia'
            );
            await page.waitForTimeout(350);
            await page.screenshot({
              path: '/tmp/muscle-memory-bodyparts-shoulder-fascia.png',
              fullPage: true,
            });

            await page.selectOption('#layer-preset', 'skin');
            assert.equal(await page.locator('#viewer').getAttribute('data-layer-preset'), 'skin');
            assert.equal(await page.locator('#viewer').getAttribute('data-skin-mode'), 'anatomical');
            assert.equal(await page.locator('#viewer').getAttribute('data-muscle-mode'), 'ghost');

            // Training temporarily strips all support layers but restores the
            // selected regional layer when the learner leaves the session.
            await page.selectOption('#layer-preset', 'fascia');
            await page.click('#mode-quiz');
            await page.click('[data-learning-mode="find"]');
            await page.click('#start-learning-session');
            assert.equal(await page.locator('#viewer').getAttribute('data-training-display'), 'true');
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-training-hidden'), 'true');
            assert.equal(await page.locator('#viewer').getAttribute('data-connective-training-hidden'), 'true');
            assert.equal(await page.locator('#viewer').getAttribute('data-skin-training-hidden'), 'true');
            await page.click('#exit-learning-session');
            assert.equal(await page.locator('#viewer').getAttribute('data-training-display'), 'false');
            assert.equal(await page.locator('#viewer').getAttribute('data-layer-preset'), 'fascia');
            assert.equal(await page.locator('#viewer').getAttribute('data-muscle-mode'), 'ghost');
            assert.equal(
              await page.locator('#viewer').getAttribute('data-connective-visible-layers'),
              'fascia'
            );
            await page.click('#mode-explore');

            // Switch to a lower-limb block before searching for the iliotibial tract:
            // regional search must not leak structures from unrelated areas.
            await page.selectOption('#learning-region', 'lower-limb');
            assert.equal(await page.locator('#viewer').getAttribute('data-region-isolation'), 'true');
            await page.selectOption('#layer-preset', 'fascia');
            await page.fill('#structure-search', 'подвздошно-большеберцовый');
            await page.waitForFunction(
              () => document.querySelectorAll('.search-result').length > 0,
              null,
              { timeout: 15000 }
            );
            const fasciaResult = page.locator('.search-result').first();
            const fasciaLabel = await fasciaResult.innerText();
            assert.match(fasciaLabel, /Подвздошно-большеберцовый тракт/i);
            assert.doesNotMatch(fasciaLabel, /iliotibial/i);
            await fasciaResult.click();
            assert.equal(
              await page.locator('#viewer').getAttribute('data-selected-study-layer'),
              'fascia'
            );
            assert.equal(
              await page.locator('#viewer').getAttribute('data-selected-study-specific'),
              'true'
            );
            assert.match(await page.locator('#question').innerText(), /Подвздошно-большеберцовый тракт/i);
            assert.equal(await page.locator('#show-nearest-muscle').isVisible(), true);
            assert.match(await page.locator('#feedback').innerText(), /пространственный ориентир/i);

            await page.click('#isolate-selected');
            assert.match(await page.locator('#isolate-selected').innerText(), /Показать окружение/i);
            await page.click('#isolate-selected');
            assert.match(await page.locator('#isolate-selected').innerText(), /Изолировать/i);
            await page.click('#show-nearest-muscle');
            assert.match(await page.locator('#question-label').innerText(), /Мышца/i);

            await page.fill('#structure-search', 'передняя большеберцовая');
            await page.waitForFunction(
              () => document.querySelectorAll('.search-result').length > 0,
              null,
              { timeout: 15000 }
            );
            const tibialisLabel = await page.locator('.search-result').first().innerText();
            assert.match(tibialisLabel, /Передняя большеберцовая/i);
            assert.doesNotMatch(tibialisLabel, /tibialis anterior/i);

            await page.selectOption('#learning-region', 'all');
            if (await page.locator('#region-isolation').isChecked()) {
              await page.locator('#region-isolation').uncheck();
            }
            assert.equal(await page.locator('#viewer').getAttribute('data-region-isolation'), 'false');

            // Whole-atlas search after explicit exit from regional isolation.
            const translationCases = [
              ['gluteus maximus', /Большая ягодичная/i],
              ['supraspinatus', /Надостная/i],
              ['biceps brachii', /двуглав/i],
              ['sternocleidomastoid', /Грудино-ключично-сосцевидная/i],
            ];
            for (const [query, expected] of translationCases) {
              await page.fill('#structure-search', query);
              await page.waitForFunction(
                () => document.querySelectorAll('.search-result').length > 0,
                null,
                { timeout: 15000 }
              );
              const label = await page.locator('.search-result').first().innerText();
              assert.match(label, expected);
              assert.match(label, /\((справа|слева)\)$/i);
              assert.doesNotMatch(label, new RegExp(query, 'i'));
            }

            await page.fill('#structure-search', 'дельтовидная');
            await page.waitForFunction(
              () => document.querySelectorAll('.search-result').length > 0,
              null,
              { timeout: 15000 }
            );
            assert.ok((await page.locator('.search-result').count()) > 0);

            await page.selectOption('#view-preset', 'front');
            await page.waitForTimeout(600);
            await page.screenshot({ path: '/tmp/muscle-memory-bodyparts-front.png', fullPage: true });

            await page.selectOption('#connective-mode', 'off');
            await page.waitForTimeout(400);
            await page.screenshot({ path: '/tmp/muscle-memory-bodyparts-front-no-connective.png', fullPage: true });
            await page.selectOption('#connective-mode', 'anatomical');
            await page.waitForTimeout(400);

            await page.selectOption('#view-preset', 'back');
            await page.waitForTimeout(600);
            await page.screenshot({ path: '/tmp/muscle-memory-bodyparts-back.png', fullPage: true });

            await page.locator('#focus-shoulder').dispatchEvent('click');
            await page.waitForTimeout(600);
            await page.screenshot({ path: '/tmp/muscle-memory-bodyparts-shoulder.png', fullPage: true });

            // Source round-trip: incompatible BodyParts tissue presets must not
            // leak into Z-Anatomy, while the selected learning block survives.
            await page.selectOption('#learning-region', 'shoulder');
            await page.selectOption('#layer-preset', 'fascia');
            assert.equal(await page.locator('#viewer').getAttribute('data-muscle-mode'), 'ghost');
            await page.selectOption('#model-source', 'z-anatomy');
            await page.waitForFunction(
              () =>
                document.querySelector('#loading')?.classList.contains('is-hidden') &&
                document.querySelector('#viewer')?.dataset.modelSource === 'z-anatomy',
              null,
              { timeout: 150000 }
            );
            assert.equal(await page.locator('#learning-region').inputValue(), 'shoulder');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-scope'), 'shoulder');
            assert.equal(await page.locator('#viewer').getAttribute('data-muscle-mode'), 'anatomical');
            assert.equal(await page.locator('#layer-preset').inputValue(), 'muscles');
            assert.equal(await page.locator('#layer-preset').isDisabled(), true);

            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          node /tmp/smoke.cjs

      - name: Upload screenshot
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-smoke]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: muscle-memory-bodyparts-smoke
          path: |
            /tmp/muscle-memory-bodyparts-*.png
            /tmp/muscle-memory-learning-*.png
          if-no-files-found: ignore
          retention-days: 7
