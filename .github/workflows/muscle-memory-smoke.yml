name: Muscle memory browser smoke

on:
  push:
    branches:
      - feature/muscle-memory-mvp
    paths:
      - experiments/muscle-memory-game/**
      - .github/workflows/muscle-memory-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muscle-memory-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check experiments/muscle-memory-game/app.js
          node --check experiments/muscle-memory-game/anatomy-terms-ru.js
          node --check experiments/muscle-memory-game/bodyparts4-classification.js
          node --check experiments/muscle-memory-game/bodyparts4-muscles-ru.js
          node --check experiments/muscle-memory-game/learning-engine.js
          node --check experiments/muscle-memory-game/learning-session.js
          node --check experiments/muscle-memory-game/check-learning-engine.mjs
          node --check experiments/muscle-memory-game/check-learning-session.mjs
          node --check experiments/muscle-memory-game/check-learning-cross-source.mjs
          node --check experiments/muscle-memory-game/check-z-anatomy-ru.mjs
          node --check experiments/muscle-memory-game/verify.mjs
          node --input-type=module <<'NODE'
          import { bodyPartsAnatomyKind } from './experiments/muscle-memory-game/bodyparts4-classification.js';
          const cases = [
            [{ system: 'skeletal', conceptId: 'FMA24474' }, 'bone', 'right femur'],
            [{ system: 'skeletal', conceptId: 'FMA22544' }, 'muscle', 'right tibialis anterior'],
            [{ system: 'skeletal', conceptId: 'FMA22552' }, 'muscle', 'right fibularis longus'],
            [{ system: 'skeletal', conceptId: 'FMA58776' }, null, 'right iliotibial tract'],
            [{ system: 'muscular', conceptId: 'FMA34682' }, 'muscle', 'deltoid part'],
          ];
          for (const [part, expected, label] of cases) {
            const actual = bodyPartsAnatomyKind(part);
            if (actual !== expected) throw new Error(label + ': expected ' + expected + ', got ' + actual);
          }
          NODE

          node --input-type=module <<'NODE'
          import { bodyPartsAnatomyKind } from './experiments/muscle-memory-game/bodyparts4-classification.js';
          import { bodyPartsMuscleNameRu } from './experiments/muscle-memory-game/bodyparts4-muscles-ru.js';

          const response = await fetch('https://raw.githubusercontent.com/ashemag/human-atlas/1c38bf35c254a891200d3cedecfd57abebe83d8d/public/models/atlas.json');
          if (!response.ok) throw new Error('Could not fetch pinned BodyParts3D atlas');
          const atlas = await response.json();
          const muscles = atlas.parts.filter(part => bodyPartsAnatomyKind(part) === 'muscle');
          const missing = muscles.filter(part => !bodyPartsMuscleNameRu(part.name));
          if (missing.length) {
            throw new Error('Missing Russian muscle names: ' + missing.map(part => part.name).join(', '));
          }
          if (muscles.length !== 416) {
            throw new Error('Unexpected BodyParts3D muscle count: ' + muscles.length);
          }
          console.log('Russian muscle names:', muscles.length + '/' + muscles.length);
          NODE

          node experiments/muscle-memory-game/check-z-anatomy-ru.mjs
          node experiments/muscle-memory-game/check-learning-engine.mjs
          node experiments/muscle-memory-game/check-learning-session.mjs
          node experiments/muscle-memory-game/check-learning-cross-source.mjs

      - name: Install browser
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify one interface for both anatomy sources
        shell: bash
        run: |
          python3 -m http.server 4173 --directory experiments/muscle-memory-game >/tmp/muscle-memory-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          cat >/tmp/smoke.cjs <<'NODE'
          const { chromium } = require('/tmp/node_modules/playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];

            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push('console: ' + msg.text());
            });

            await page.goto('http://127.0.0.1:4173/?mode=explore', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(
              () => {
                const loading = document.querySelector('#loading');
                const question = document.querySelector('#question')?.textContent || '';
                return loading?.classList.contains('is-hidden') ||
                  /Не удалось загрузить|Ошибка загрузки/.test((loading?.textContent || '') + ' ' + question);
              },
              null,
              { timeout: 150000 }
            );

            const initialLoadingHidden = await page.locator('#loading').evaluate(
              el => el.classList.contains('is-hidden')
            );
            if (!initialLoadingHidden) {
              throw new Error(
                'Initial model load failed: ' +
                await page.locator('#loading').innerText() +
                ' | ' +
                await page.locator('#diagnostics').innerText() +
                ' | browser errors: ' +
                errors.join(' || ')
              );
            }

            assert.equal(new URL(page.url()).pathname, '/');
            assert.equal(await page.locator('#model-source').inputValue(), 'z-anatomy');
            assert.equal(await page.locator('#viewer').getAttribute('data-model-source'), 'z-anatomy');
            assert.equal(await page.locator('#learning-region').isDisabled(), false);
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-learning-catalog-count')) > 140);
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-learning-target-count')) > 140);
            assert.equal(await page.locator('#learning-controls').isHidden(), true);

            await page.click('#mode-quiz');
            assert.equal(await page.locator('#learning-controls').isVisible(), true);

            await page.selectOption('#learning-region', 'shoulder');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-region'), 'shoulder');
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-learning-target-count')) > 0);
            assert.match(await page.locator('#learning-summary').innerText(), /Плечевой пояс/);

            await page.selectOption('#learning-region', 'all');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-region'), 'all');

            // Pass 2: finite learning sessions must work as real flows.
            await page.selectOption('#learning-region', 'shoulder');
            await page.selectOption('#learning-session-size', '5');

            // FIND: start, reveal one answer, advance.
            await page.click('[data-learning-mode="find"]');
            await page.click('#start-learning-session');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-mode'), 'find');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-total'), '5');
            assert.match(await page.locator('#question').innerText(), /Найдите:/);
            await page.click('#show-answer');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-done'), '1');
            let storedLearning = await page.evaluate(() =>
              localStorage.getItem('muscle-memory-learning-v1')
            );
            assert.ok(storedLearning && storedLearning.includes('::find'));

            // Finish the whole five-item session and open its result.
            for (let done = 1; done < 5; done += 1) {
              await page.click('#next-question');
              await page.click('#show-answer');
              assert.equal(
                await page.locator('#viewer').getAttribute('data-learning-session-done'),
                String(done + 1)
              );
            }
            await page.click('#next-question');
            assert.match(await page.locator('#question-label').innerText(), /Сессия завершена/i);
            assert.match(await page.locator('#next-question').innerText(), /Повторить ошибки/);

            // The result screen must start a mistake-review session directly.
            await page.click('#next-question');
            assert.equal(await page.locator('#learning-session-mode').inputValue(), 'mistakes');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-mode'), 'mistakes');
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-learning-session-total')) > 0);
            assert.equal(await page.locator('#exit-learning-session').isVisible(), true);
            await page.click('#exit-learning-session');

            // NAME: four smart choices, eventually one must complete the item.
            await page.click('[data-learning-mode="name"]');
            await page.click('#start-learning-session');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-mode'), 'name');
            assert.equal(await page.locator('.name-choice').count(), 4);
            assert.match(await page.locator('#question').innerText(), /Назовите выделенную мышцу/);
            for (let tries = 0; tries < 4; tries += 1) {
              const enabled = page.locator('.name-choice:not(:disabled)').first();
              if (!(await enabled.count())) break;
              await enabled.click();
              if ((await page.locator('#viewer').getAttribute('data-learning-session-done')) === '1') break;
            }
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-done'), '1');
            storedLearning = await page.evaluate(() =>
              localStorage.getItem('muscle-memory-learning-v1')
            );
            assert.ok(storedLearning && storedLearning.includes('::name'));
            await page.click('#exit-learning-session');

            // PRACTICAL: mixed finite practice, not a duplicate FIND flow.
            await page.click('[data-learning-mode="practical"]');
            await page.click('#start-learning-session');
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-session-mode'), 'practical');
            assert.match(await page.locator('#question-label').innerText(), /Практикум/i);
            assert.match(await page.locator('#session-progress').innerText(), /1 из 5/i);
            for (let done = 0; done < 5; done += 1) {
              await page.click('#show-answer');
              assert.equal(
                await page.locator('#viewer').getAttribute('data-learning-session-done'),
                String(done + 1)
              );
              if (done < 4) await page.click('#next-question');
            }
            await page.click('#next-question');
            assert.match(await page.locator('#question-label').innerText(), /Сессия завершена/i);
            await page.screenshot({ path: '/tmp/muscle-memory-learning-summary.png', fullPage: true });

            // Return to setup before checking the mobile NAME flow.
            await page.click('#mode-explore');
            await page.click('#mode-quiz');

            // Mobile training becomes a task sheet attached to the 3D viewer.
            await page.setViewportSize({ width: 412, height: 915 });
            await page.click('[data-learning-mode="name"]');
            await page.click('#start-learning-session');
            assert.equal(await page.locator('#learning-controls').isHidden(), true);
            assert.equal(await page.locator('.name-choice').count(), 4);
            assert.equal(
              await page.locator('.question-card').evaluate(el => el.parentElement?.classList.contains('viewer-wrap')),
              true
            );
            assert.equal(await page.locator('#score').isHidden(), true);
            await page.screenshot({ path: '/tmp/muscle-memory-learning-mobile-name.png', fullPage: true });
            await page.setViewportSize({ width: 1440, height: 1000 });

            await page.click('#mode-explore');
            assert.equal(await page.locator('#learning-controls').isHidden(), true);

            await page.fill('#structure-search', 'deltoid');
            await page.waitForFunction(
              () => document.querySelectorAll('.search-result').length > 0,
              null,
              { timeout: 15000 }
            );
            assert.ok((await page.locator('.search-result').count()) > 0);
            const zDeltoidLabel = await page.locator('.search-result').first().innerText();
            assert.match(zDeltoidLabel, /Дельтовидн/i);
            assert.doesNotMatch(zDeltoidLabel, /deltoid/i);

            const pathnameBefore = new URL(page.url()).pathname;
            await page.locator('.viewer-settings > summary').click();
            await page.selectOption('#model-source', 'bodyparts4');

            await page.waitForFunction(
              () =>
                document.querySelector('#loading')?.classList.contains('is-hidden') &&
                document.querySelector('#viewer')?.dataset.modelSource === 'bodyparts4',
              null,
              { timeout: 150000 }
            );

            assert.equal(new URL(page.url()).pathname, pathnameBefore, 'Model switch must not navigate away');
            assert.equal(await page.locator('#model-source').inputValue(), 'bodyparts4');
            assert.equal(await page.locator('#mode-explore').getAttribute('aria-pressed'), 'true');
            assert.equal(await page.locator('#learning-region').isDisabled(), false);
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-learning-catalog-count')) > 140);
            assert.equal(await page.locator('#viewer').getAttribute('data-learning-region'), 'shoulder');
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-learning-target-count')) > 0);
            assert.equal(await page.locator('#bone-mode').inputValue(), 'anatomical');
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-mode'), 'anatomical');
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-transparent'), 'false');
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-stencil'), 'off');

            assert.equal(await page.locator('#connective-mode').isDisabled(), false);
            assert.equal(await page.locator('#connective-mode').inputValue(), 'anatomical');
            assert.ok(Number(await page.locator('#viewer').getAttribute('data-connective-count')) > 0);
            assert.equal(await page.locator('#viewer').getAttribute('data-connective-mode'), 'anatomical');

            await page.selectOption('#connective-mode', 'ghost');
            assert.equal(await page.locator('#viewer').getAttribute('data-connective-mode'), 'ghost');
            await page.selectOption('#connective-mode', 'off');
            assert.equal(await page.locator('#viewer').getAttribute('data-connective-mode'), 'off');
            await page.selectOption('#connective-mode', 'anatomical');
            assert.equal(await page.locator('#viewer').getAttribute('data-connective-mode'), 'anatomical');

            await page.selectOption('#bone-mode', 'xray');
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-mode'), 'xray');
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-transparent'), 'true');

            await page.selectOption('#bone-mode', 'anatomical');
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-mode'), 'anatomical');
            assert.equal(await page.locator('#viewer').getAttribute('data-bone-transparent'), 'false');

            await page.fill('#structure-search', 'передняя большеберцовая');
            await page.waitForFunction(
              () => document.querySelectorAll('.search-result').length > 0,
              null,
              { timeout: 15000 }
            );
            const tibialisLabel = await page.locator('.search-result').first().innerText();
            assert.match(tibialisLabel, /Передняя большеберцовая/i);
            assert.doesNotMatch(tibialisLabel, /tibialis anterior/i);

            const translationCases = [
              ['gluteus maximus', /Большая ягодичная/i],
              ['supraspinatus', /Надостная/i],
              ['biceps brachii', /двуглав/i],
              ['sternocleidomastoid', /Грудино-ключично-сосцевидная/i],
            ];
            for (const [query, expected] of translationCases) {
              await page.fill('#structure-search', query);
              await page.waitForFunction(
                () => document.querySelectorAll('.search-result').length > 0,
                null,
                { timeout: 15000 }
              );
              const label = await page.locator('.search-result').first().innerText();
              assert.match(label, expected);
              assert.doesNotMatch(label, new RegExp(query, 'i'));
            }

            await page.fill('#structure-search', 'дельтовидная');
            await page.waitForFunction(
              () => document.querySelectorAll('.search-result').length > 0,
              null,
              { timeout: 15000 }
            );
            assert.ok((await page.locator('.search-result').count()) > 0);

            await page.selectOption('#view-preset', 'front');
            await page.waitForTimeout(600);
            await page.screenshot({ path: '/tmp/muscle-memory-bodyparts-front.png', fullPage: true });

            await page.selectOption('#connective-mode', 'off');
            await page.waitForTimeout(400);
            await page.screenshot({ path: '/tmp/muscle-memory-bodyparts-front-no-connective.png', fullPage: true });
            await page.selectOption('#connective-mode', 'anatomical');
            await page.waitForTimeout(400);

            await page.selectOption('#view-preset', 'back');
            await page.waitForTimeout(600);
            await page.screenshot({ path: '/tmp/muscle-memory-bodyparts-back.png', fullPage: true });

            await page.locator('#focus-shoulder').dispatchEvent('click');
            await page.waitForTimeout(600);
            await page.screenshot({ path: '/tmp/muscle-memory-bodyparts-shoulder.png', fullPage: true });

            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          node /tmp/smoke.cjs

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muscle-memory-bodyparts-smoke
          path: |
            /tmp/muscle-memory-bodyparts-*.png
            /tmp/muscle-memory-learning-*.png
          if-no-files-found: ignore
          retention-days: 7
