name: Muscle memory browser smoke

on:
  push:
    branches:
      - feature/muscle-memory-mvp
      - release/static-atlas-v1
      - feature/muscle-memory-account-sync
    paths:
      - experiments/muscle-memory-game/**
      - services/muscle-memory-account/**
      - .github/workflows/muscle-memory-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

# Ordinary pushes run the fast deterministic checks only. The expensive
# Chromium + two-model journey is reserved for explicit checkpoints:
# workflow_dispatch or a commit message containing [full-smoke].
#
# Fast runs use a unique concurrency group, so they never cancel or wait for
# checkpoints. Full-smoke runs share one group: a newer checkpoint supersedes
# an older checkpoint, but ordinary pushes cannot cancel it.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-smoke]')) && 'muscle-memory-full-smoke' || contains(github.event.head_commit.message, '[atlas-context-smoke]') && 'muscle-memory-atlas-context-smoke' || contains(github.event.head_commit.message, '[reference-audit]') && 'muscle-memory-reference-audit' || contains(github.event.head_commit.message, '[bodyparts-smoke]') && 'muscle-memory-bodyparts-smoke' || contains(github.event.head_commit.message, '[reference-smoke]') && 'muscle-memory-reference-smoke' || contains(github.event.head_commit.message, '[motion-smoke]') && 'muscle-memory-motion-smoke' || contains(github.event.head_commit.message, '[native-bone-smoke]') && 'muscle-memory-native-bone-smoke' || contains(github.event.head_commit.message, '[elbow-smoke]') && 'muscle-memory-elbow-smoke' || contains(github.event.head_commit.message, '[mobile-training-smoke]') && 'muscle-memory-mobile-training-smoke' || format('muscle-memory-fast-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-smoke]') || contains(github.event.head_commit.message, '[atlas-context-smoke]') || contains(github.event.head_commit.message, '[reference-audit]') || contains(github.event.head_commit.message, '[bodyparts-smoke]') || contains(github.event.head_commit.message, '[reference-smoke]') || contains(github.event.head_commit.message, '[motion-smoke]') || contains(github.event.head_commit.message, '[native-bone-smoke]') || contains(github.event.head_commit.message, '[elbow-smoke]') || contains(github.event.head_commit.message, '[mobile-training-smoke]') }}

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check experiments/muscle-memory-game/app.js
          node --check experiments/muscle-memory-game/account-client.js
          node --check experiments/muscle-memory-game/check-account-client.mjs
          node --check services/muscle-memory-account/server.mjs
          node --check experiments/muscle-memory-game/anatomy-terms-ru.js
          node --check experiments/muscle-memory-game/quality-lab.js
          node --check experiments/muscle-memory-game/bodyparts4-classification.js
          node --check experiments/muscle-memory-game/bodyparts4-muscles-ru.js
          node --check experiments/muscle-memory-game/learning-engine.js
          node --check experiments/muscle-memory-game/anatomy-semantics.js
          node --check experiments/muscle-memory-game/motion-readiness.js
          node --check experiments/muscle-memory-game/motion-sources.js
          node --check experiments/muscle-memory-game/motion-visual-assets.js
          node --check experiments/muscle-memory-game/motion-muscle-assets.js
          node --check experiments/muscle-memory-game/motion-vtp.js
          node --check experiments/muscle-memory-game/motion-native-bones.js
          node --check experiments/muscle-memory-game/motion-native-clips.js
          node --check experiments/muscle-memory-game/motion-tsm-muscle-path.js
          node --check experiments/muscle-memory-game/motion-myoarm-elbow.js
          node --check experiments/muscle-memory-game/motion-clip.js
          node --check experiments/muscle-memory-game/motion-registration.js
          node --check experiments/muscle-memory-game/motion-contract.js
          node --check experiments/muscle-memory-game/motion-geometry.js
          node --check experiments/muscle-memory-game/motion-three.js
          node --check experiments/muscle-memory-game/virtual-specimens.js
          node --check experiments/muscle-memory-game/regional-depth-map.js
          node --check experiments/muscle-memory-game/learning-session.js
          node --check experiments/muscle-memory-game/learning-navigation.js
          node --check experiments/muscle-memory-game/topography-learning.js
          node --check experiments/muscle-memory-game/retention-engine.js
          node --check experiments/muscle-memory-game/progress-engine.js
          node --check experiments/muscle-memory-game/check-learning-engine.mjs
          node --check experiments/muscle-memory-game/check-learning-session.mjs
          node --check experiments/muscle-memory-game/check-learning-navigation.mjs
          node --check experiments/muscle-memory-game/check-topography-learning.mjs
          node --check experiments/muscle-memory-game/check-quiz-ui.mjs
          node --check experiments/muscle-memory-game/check-regional-rendering.mjs
          node --check experiments/muscle-memory-game/check-retention-engine.mjs
          node --check experiments/muscle-memory-game/check-progress-engine.mjs
          node --check experiments/muscle-memory-game/check-learning-cross-source.mjs
          node --check experiments/muscle-memory-game/check-anatomy-validation.mjs
          node --check experiments/muscle-memory-game/check-study-layers.mjs
          node --check experiments/muscle-memory-game/check-virtual-specimens.mjs
          node --check experiments/muscle-memory-game/check-learning-blocks.mjs
          node --check experiments/muscle-memory-game/check-virtual-specimen-coverage.mjs
          node --check experiments/muscle-memory-game/check-specimen-bone-context.mjs
          node --check experiments/muscle-memory-game/check-muscle-bone-context.mjs
          node --check experiments/muscle-memory-game/check-specimen-clipping.mjs
          node --check experiments/muscle-memory-game/check-regional-performance.mjs
          node --check experiments/muscle-memory-game/check-motion-readiness.mjs
          node --check experiments/muscle-memory-game/check-motion-semantics.mjs
          node --check experiments/muscle-memory-game/check-motion-muscle-assets.mjs
          node --check experiments/muscle-memory-game/check-product-shell.mjs
          node --check experiments/muscle-memory-game/check-display-drawer.mjs
          node --check experiments/muscle-memory-game/check-atlas-navigation.mjs
          node --check experiments/muscle-memory-game/check-muscle-reference.mjs
          node --check experiments/muscle-memory-game/check-functional-relations.mjs
          node --check experiments/muscle-memory-game/check-bodyparts-muscle-restoration.mjs
          node --check experiments/muscle-memory-game/check-bodyparts-back-occlusion.mjs
          node --check experiments/muscle-memory-game/check-standard-motion-asset.mjs
          node --check experiments/muscle-memory-game/check-motion-native-bones.mjs
          node --check experiments/muscle-memory-game/check-static-release.mjs
          python -m py_compile experiments/muscle-memory-game/probe-opensim-muscle-paths.py
          python -m py_compile experiments/muscle-memory-game/export-opensim-muscle-path.py
          node --check experiments/muscle-memory-game/check-motion-muscle-path-file.mjs
          node --check experiments/muscle-memory-game/check-motion-sources.mjs
          node --check experiments/muscle-memory-game/check-motion-clip-file.mjs
          node --check experiments/muscle-memory-game/check-motion-simulation-contract.mjs
          node --check experiments/muscle-memory-game/check-motion-three.mjs
          node --check experiments/muscle-memory-game/check-motion-kinematics.mjs
          node --check experiments/muscle-memory-game/check-motion-layout.mjs
          node --check experiments/muscle-memory-game/check-anatomical-depth.mjs
          node --check experiments/muscle-memory-game/study-layer-terms-ru.js
          node --check experiments/muscle-memory-game/reference-terms-ru.js
          node --check experiments/muscle-memory-game/check-z-anatomy-ru.mjs
          node --check experiments/muscle-memory-game/check-bodyparts-ru.mjs
          node --check experiments/muscle-memory-game/check-support-terms-ru.mjs
          node --check experiments/muscle-memory-game/check-reference-layer-interaction.mjs
          node --check experiments/muscle-memory-game/browser-smoke-learning-core.cjs
          node --check experiments/muscle-memory-game/browser-smoke-learning-practical.cjs
          node --check experiments/muscle-memory-game/browser-smoke-z-anatomy.cjs
          node --check experiments/muscle-memory-game/browser-smoke-reference-cards.cjs
          node --check experiments/muscle-memory-game/browser-smoke-bodyparts.cjs
          node --check experiments/muscle-memory-game/anatomy-model-names.js
          node --check experiments/muscle-memory-game/reference-ui.js
          node --check experiments/muscle-memory-game/reference-data/functional-parts.js
          node --check experiments/muscle-memory-game/browser-smoke-reference-ui.cjs
          node --check experiments/muscle-memory-game/browser-smoke-mobile-atlas.cjs
          node --check experiments/muscle-memory-game/browser-smoke-mobile-training.cjs
          node --check experiments/muscle-memory-game/browser-smoke-motion.cjs
          node --check experiments/muscle-memory-game/browser-smoke-native-bones.cjs
          node --check experiments/muscle-memory-game/browser-smoke-elbow.cjs
          node --check experiments/muscle-memory-game/browser-smoke-mobile-motion.cjs
          node --check experiments/muscle-memory-game/verify.mjs
          node --input-type=module <<'NODE'
          import { bodyPartsAnatomyKind } from './experiments/muscle-memory-game/bodyparts4-classification.js';
          const cases = [
            [{ system: 'skeletal', conceptId: 'FMA24474' }, 'bone', 'right femur'],
            [{ system: 'skeletal', conceptId: 'FMA22544' }, 'muscle', 'right tibialis anterior'],
            [{ system: 'skeletal', conceptId: 'FMA22552' }, 'muscle', 'right fibularis longus'],
            [{ system: 'skeletal', conceptId: 'FMA58776' }, null, 'right iliotibial tract'],
            [{ system: 'muscular', conceptId: 'FMA34682' }, 'muscle', 'deltoid part'],
            [{ system: 'connective', conceptId: 'FMA22425' }, 'muscle', 'right tensor fasciae latae'],
            [{ system: 'connective', conceptId: 'FMA22426' }, 'muscle', 'left tensor fasciae latae'],
          ];
          for (const [part, expected, label] of cases) {
            const actual = bodyPartsAnatomyKind(part);
            if (actual !== expected) throw new Error(label + ': expected ' + expected + ', got ' + actual);
          }
          NODE

          node --input-type=module <<'NODE'
          import { bodyPartsAnatomyKind } from './experiments/muscle-memory-game/bodyparts4-classification.js';
          import { bodyPartsMuscleNameRu } from './experiments/muscle-memory-game/bodyparts4-muscles-ru.js';

          const response = await fetch('https://raw.githubusercontent.com/ashemag/human-atlas/1c38bf35c254a891200d3cedecfd57abebe83d8d/public/models/atlas.json');
          if (!response.ok) throw new Error('Could not fetch pinned BodyParts3D atlas');
          const atlas = await response.json();
          const muscles = atlas.parts.filter(part => bodyPartsAnatomyKind(part) === 'muscle');
          const missing = muscles.filter(part => !bodyPartsMuscleNameRu(part.name));
          if (missing.length) {
            throw new Error('Missing Russian muscle names: ' + missing.map(part => part.name).join(', '));
          }
          const latinUserFacing = muscles.filter(part => /[A-Za-z]/.test(bodyPartsMuscleNameRu(part.name) || ''));
          if (latinUserFacing.length) {
            throw new Error(
              'Latin fragments leaked into Russian BodyParts labels: ' +
              latinUserFacing.map(part => part.name + ' -> ' + bodyPartsMuscleNameRu(part.name)).join(' | ')
            );
          }
          if (muscles.length !== 418) {
            throw new Error('Unexpected BodyParts3D base muscle count after classification fixes: ' + muscles.length);
          }
          console.log('Russian muscle names:', muscles.length + '/' + muscles.length);
          NODE

          node experiments/muscle-memory-game/check-z-anatomy-ru.mjs
          node experiments/muscle-memory-game/check-bodyparts-ru.mjs
          node experiments/muscle-memory-game/check-support-terms-ru.mjs
          node experiments/muscle-memory-game/check-anatomy-model-names.mjs
          node experiments/muscle-memory-game/check-reference-layer-interaction.mjs
          node experiments/muscle-memory-game/check-learning-engine.mjs
          node experiments/muscle-memory-game/check-learning-session.mjs
          node experiments/muscle-memory-game/check-learning-navigation.mjs
          node experiments/muscle-memory-game/check-topography-learning.mjs
          node experiments/muscle-memory-game/check-quiz-ui.mjs
          node experiments/muscle-memory-game/check-regional-rendering.mjs
          node experiments/muscle-memory-game/check-retention-engine.mjs
          node experiments/muscle-memory-game/check-progress-engine.mjs
          node experiments/muscle-memory-game/check-learning-cross-source.mjs
          node experiments/muscle-memory-game/check-anatomy-validation.mjs
          node experiments/muscle-memory-game/check-study-layers.mjs
          node experiments/muscle-memory-game/check-virtual-specimens.mjs
          node experiments/muscle-memory-game/check-learning-blocks.mjs
          node experiments/muscle-memory-game/check-virtual-specimen-coverage.mjs
          node experiments/muscle-memory-game/check-specimen-bone-context.mjs
          node experiments/muscle-memory-game/check-muscle-bone-context.mjs
          node experiments/muscle-memory-game/check-specimen-clipping.mjs
          node experiments/muscle-memory-game/check-regional-performance.mjs
          node experiments/muscle-memory-game/check-motion-readiness.mjs
          node experiments/muscle-memory-game/check-motion-semantics.mjs
          node experiments/muscle-memory-game/check-motion-muscle-assets.mjs
          node experiments/muscle-memory-game/check-product-shell.mjs
          node experiments/muscle-memory-game/check-display-drawer.mjs
          node experiments/muscle-memory-game/check-atlas-navigation.mjs
          node experiments/muscle-memory-game/check-muscle-reference.mjs
          node experiments/muscle-memory-game/check-functional-relations.mjs
          node experiments/muscle-memory-game/check-bodyparts-muscle-restoration.mjs
          node experiments/muscle-memory-game/check-bodyparts-back-occlusion.mjs
          node experiments/muscle-memory-game/check-standard-motion-asset.mjs
          node experiments/muscle-memory-game/check-motion-native-bones.mjs
          node experiments/muscle-memory-game/check-static-release.mjs
          node experiments/muscle-memory-game/check-motion-sources.mjs
          node experiments/muscle-memory-game/check-motion-simulation-contract.mjs
          node experiments/muscle-memory-game/check-motion-three.mjs
          node experiments/muscle-memory-game/check-motion-kinematics.mjs
          node experiments/muscle-memory-game/check-motion-layout.mjs
          node experiments/muscle-memory-game/check-anatomical-depth.mjs
          node experiments/muscle-memory-game/check-region-depth.mjs
          node experiments/muscle-memory-game/check-deeper-links.mjs
          node experiments/muscle-memory-game/check-account-client.mjs

  account-backend:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: muscle_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d muscle_memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install account service dependencies
        run: npm install --prefix services/muscle-memory-account --no-audit --no-fund

      - name: Account lifecycle and progress persistence
        env:
          NODE_ENV: test
          PORT: 18080
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/muscle_memory_test
          PUBLIC_APP_URL: http://127.0.0.1:19090
          APP_ORIGINS: http://127.0.0.1:19090
          DATA_OPERATOR_FULL_NAME: Test Operator
          DATA_OPERATOR_ADDRESS: Russia
          DATA_OPERATOR_EMAIL: operator@example.test
          PRIVACY_CONSENT_VERSION: test-v1
          CROSS_BORDER_TRANSFER: "false"
          SMTP_JSON_TRANSPORT: "true"
          SMTP_FROM: test@example.test
          ACCOUNT_TEST_BASE: http://127.0.0.1:18080
          ACCOUNT_TEST_ORIGIN: http://127.0.0.1:19090
        run: |
          node services/muscle-memory-account/server.mjs > /tmp/mm-account.log 2>&1 &
          service_pid=$!
          trap 'status=$?; cat /tmp/mm-account.log; kill "$service_pid" 2>/dev/null || true; exit "$status"' EXIT
          node services/muscle-memory-account/check-account-service.mjs

  browser:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-smoke]') || contains(github.event.head_commit.message, '[atlas-smoke]') }}
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 21
    strategy:
      fail-fast: false
      matrix:
        phase:
          - learning-core
          - learning-practical
          - z-anatomy
          - bodyparts
          - mobile-atlas
          - mobile-training
          - reference-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run ${{ matrix.phase }} browser checkpoint
        shell: bash
        run: |
          python3 -m http.server 4173 --directory experiments/muscle-memory-game >/tmp/muscle-memory-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          # The long learning and two-model journeys render dense anatomy on
          # software WebGL. Preserve every assertion and allow them to finish.
          CHECKPOINT_BUDGET=13m
          if [[ '${{ matrix.phase }}' == 'learning-core' || '${{ matrix.phase }}' == 'bodyparts' ]]; then
            CHECKPOINT_BUDGET=18m
          fi
          timeout "$CHECKPOINT_BUDGET" node experiments/muscle-memory-game/browser-smoke-${{ matrix.phase }}.cjs

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: muscle-memory-${{ matrix.phase }}-smoke
          path: /tmp/muscle-memory-*.png
          if-no-files-found: ignore
          retention-days: 7



  browser-atlas-context:
    if: ${{ contains(github.event.head_commit.message, '[atlas-context-smoke]') }}
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 21
    strategy:
      fail-fast: false
      matrix:
        phase:
          - z-anatomy
          - bodyparts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Atlas context checkpoint
        shell: bash
        run: |
          python3 -m http.server 4173 --directory experiments/muscle-memory-game >/tmp/muscle-memory-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHECKPOINT_BUDGET=7m
          if [[ '${{ matrix.phase }}' == 'bodyparts' ]]; then
            CHECKPOINT_BUDGET=18m
          fi
          timeout "$CHECKPOINT_BUDGET" node experiments/muscle-memory-game/browser-smoke-${{ matrix.phase }}.cjs

      - name: Upload Atlas context screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: muscle-memory-atlas-context-${{ matrix.phase }}
          path: /tmp/muscle-memory-*.png
          if-no-files-found: ignore
          retention-days: 7


  browser-reference-audit:
    if: ${{ contains(github.event.head_commit.message, '[reference-audit]') }}
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Z-Anatomy reference-layer names
        run: |
          node experiments/muscle-memory-game/audit-reference-layer-names.mjs > /tmp/reference-layer-names.json
          cat /tmp/reference-layer-names.json

      - name: Upload reference-layer audit
        uses: actions/upload-artifact@v4
        with:
          name: z-anatomy-reference-layer-names
          path: /tmp/reference-layer-names.json
          retention-days: 7


  browser-reference:
    if: ${{ contains(github.event.head_commit.message, '[reference-smoke]') }}
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run four-muscle reference checkpoint
        shell: bash
        run: |
          python3 -m http.server 4173 --directory experiments/muscle-memory-game >/tmp/muscle-memory-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          timeout 5m node experiments/muscle-memory-game/browser-smoke-reference-cards.cjs

      - name: Upload reference-card screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: muscle-memory-reference-cards-smoke
          path: /tmp/muscle-memory-reference-*.png
          if-no-files-found: ignore
          retention-days: 7


  browser-pelvic-reference:
    if: ${{ contains(github.event.head_commit.message, '[pelvic-reference-smoke]') }}
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run pelvic-floor reference checkpoint
        shell: bash
        run: |
          python3 -m http.server 4173 --directory experiments/muscle-memory-game >/tmp/muscle-memory-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          timeout 8m node experiments/muscle-memory-game/browser-smoke-pelvic-floor-reference.cjs



  browser-mobile-atlas-targeted:
    if: ${{ contains(github.event.head_commit.message, '[mobile-atlas-smoke]') }}
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run mobile Atlas checkpoint
        shell: bash
        run: |
          python3 -m http.server 4173 --directory experiments/muscle-memory-game >/tmp/muscle-memory-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          timeout 6m node experiments/muscle-memory-game/browser-smoke-mobile-atlas.cjs

      - name: Upload mobile Atlas screenshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: muscle-memory-mobile-atlas-targeted
          path: /tmp/muscle-memory-mobile-atlas.png
          if-no-files-found: ignore
          retention-days: 7


  browser-mobile-training:
    if: ${{ contains(github.event.head_commit.message, '[mobile-training-smoke]') }}
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run mobile Training checkpoint
        shell: bash
        run: |
          python3 -m http.server 4173 --directory experiments/muscle-memory-game >/tmp/muscle-memory-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          timeout 6m node experiments/muscle-memory-game/browser-smoke-mobile-training.cjs

      - name: Upload mobile Training screenshot
