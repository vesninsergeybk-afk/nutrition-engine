name: Nutrient Android Offline APK

on:
  push:
    branches:
      - feature/nutrient-android-offline-20261023
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build offline APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Package pinned local calculator
        run: python3 android/tools/package_web.py

      - name: Check offline boundary
        run: python3 android/tools/check_offline.py

      - name: Build installable alpha APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK has no INTERNET permission
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo 'An offline build must never request INTERNET permission'
            exit 1
          fi
          echo 'APK permissions gate passed'

      - uses: actions/upload-artifact@v4
        with:
          name: nutrient-android-offline-alpha
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
