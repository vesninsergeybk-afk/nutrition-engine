name: Complete Nutrition Engine import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-nutrition-import.yml'
      - '.transfer/**'

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct omitted generated files
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc assets/runtime/deferred-runtime-v5.3.210-rc2-hf24.js.gz > assets/runtime/deferred-runtime-v5.3.210-rc2-hf24.js
          gzip -dc assets/runtime/deferred-runtime-v5.3.210-rc2-hf24.legacy.js.gz > assets/runtime/deferred-runtime-v5.3.210-rc2-hf24.legacy.js

          cp assets/runtime/deferred-runtime-v5.3.210-rc2-hf24.js assets/runtime/deferred-runtime-v5.3.210-rc2-hf23.js
          patch -p0 < .transfer/hf24-to-hf23.patch
          cp assets/runtime/deferred-runtime-v5.3.210-rc2-hf24.legacy.js assets/runtime/deferred-runtime-v5.3.210-rc2-hf23.legacy.js
          patch -p0 < .transfer/hf24-legacy-to-hf23-legacy.patch

          cp assets/runtime/deferred-runtime-v5.3.210-rc2-hf23.js assets/runtime/deferred-runtime-v5.3.210-rc2-hf22.js
          patch -p0 < .transfer/hf23-to-hf22.patch
          cp assets/runtime/deferred-runtime-v5.3.210-rc2-hf23.legacy.js assets/runtime/deferred-runtime-v5.3.210-rc2-hf22.legacy.js
          patch -p0 < .transfer/hf23-legacy-to-hf22-legacy.patch

          python - <<'PY'
          from pathlib import Path
          import re
          parts=[]
          for i in range(1,13):
              p=Path(f"assets/data/products.v5.3.210-p1.3.part-{i:02d}.js")
              s=p.read_text(encoding="utf-8")
              m=re.search(r"window\.__PRODUCT_SCRIPT_CHUNKS__\[\d+\]\s*=\s*([\s\S]*);\n?$",s)
              if not m:
                  raise SystemExit(f"Cannot extract product chunk {i}")
              parts.append(m.group(1))
          combined="["+",".join(x[1:-1] for x in parts)+"]"
          out="/* HF23 single-request product bundle generated from canonical JSON chunks. */\nwindow.__PRODUCTS_BUNDLE__="+combined+";\n"
          Path("assets/data/products.v5.3.210-p1.3.bundle.js").write_text(out,encoding="utf-8")
          PY

      - name: Verify exact source blobs
        shell: bash
        run: |
          set -euo pipefail
          check() {
            got="$(git hash-object "$1")"
            test "$got" = "$2" || { echo "SHA mismatch: $1 expected=$2 got=$got"; exit 1; }
          }
          check assets/data/products.v5.3.210-p1.3.bundle.js cf620a1b68f8ffc65e92632464c7db616e0b9510
          check assets/data/products.v5.3.210-p1.3.compact.json.gz 5d3201e9a3423095e5b7f1172e3040c3f137ba63
          check assets/icons/retro-2bit-icons-v1.png e2d59c4ec8c04197e4c010e34f2e2f97547ff621
          check assets/icons/retro-2bit-icons-v2-preview.png de7154f75eaac0eedde50b5bd41d0b3b71dd3b95
          check assets/images/harvard-plate/v5/companions/healthy-fats-v5.png 722b3a344a196dfe9ae2624287c465f4b32350a5
          check assets/images/harvard-plate/v5/companions/water-v5.png edebf2daaa7590ad3dea533c9bcf9ba5af5da121
          check assets/loader/loader-fallback-retro-2bit-v5.3.148.png 350357df7cf9a7576154052e323401e35511e22a
          check assets/loader/loader-fallback-v5.3.37.png 4cd32b8d7b047f189ea6aa59ab0f8c8d58e19e98
          check assets/loader/loader-sprite-sheet-retro-2bit-v5.3.148.png b7436d2780a43f4c9a1693fc07981466a2d0166d
          check assets/loader/loader-sprite-sheet-v5.3.37.png 55f94cfc031c46bb1aced5de822181be6e3b9f09
          check assets/runtime/deferred-runtime-v5.3.210-rc2-hf22.js 10e13f817b3bc97b1fead2d0fe6c2a72d792c4d7
          check assets/runtime/deferred-runtime-v5.3.210-rc2-hf22.legacy.js e0708da57a0e5746953410000774d84863724edd
          check assets/runtime/deferred-runtime-v5.3.210-rc2-hf23.js 18a3d5102950d544871b6e8d212ac474a04e857b
          check assets/runtime/deferred-runtime-v5.3.210-rc2-hf23.legacy.js 3ece2396e855224f51a08d9c19dfc71250307105
          check assets/runtime/deferred-runtime-v5.3.210-rc2-hf24.js b926850f5032c9edbf34d56116d3e93cf4dfb05f
          check assets/runtime/deferred-runtime-v5.3.210-rc2-hf24.js.gz 13953bd34915ea1c9e4c7db16e7764b1f3f2c4a5
          check assets/runtime/deferred-runtime-v5.3.210-rc2-hf24.legacy.js 18ccaca5a4ccf343ed2b2f3be0b578dfadce48af
          check assets/runtime/deferred-runtime-v5.3.210-rc2-hf24.legacy.js.gz b6219d9b0b6b0ab6448c1e9dae6f7ac7b4357185

      - name: Commit completed import
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .transfer
          rm -f .github/workflows/complete-nutrition-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Nutrition Engine import"
          git push origin HEAD:main
