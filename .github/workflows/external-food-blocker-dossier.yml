name: External Food 56 Blocker Dossier

on:
  push:
    branches: [data-food-wave3-resolution-20261009]
    paths:
      - "tools/audit_external_food_blockers.py"
      - ".github/workflows/external-food-blocker-dossier.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evidence-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify and load immutable 4E records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 37851579594 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = "success"
          mkdir -p .input
          gh run download 37851579594 --repo "$GITHUB_REPOSITORY" --name external-food-step4e-integrity --dir .input
          test -s .input/step4e_blocked_other.json
          test -s .input/step4e_state_blocked.json
      - name: Inventory all unresolved exact fields and sources
        run: |
          python3 tools/audit_external_food_blockers.py \
            --blocked .input/step4e_blocked_other.json \
            --state-blocked .input/step4e_state_blocked.json \
            --output .output
          cat .output/blocked56_inventory.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: external-food-blocked56-science-ledger
          path: .output/
          retention-days: 21
          include-hidden-files: true
          if-no-files-found: error
