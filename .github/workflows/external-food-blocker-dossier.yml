name: External Food 56 Blocker Dossier

on:
  push:
    branches: [data-food-wave3-resolution-20261009]
    paths:
      - "tools/audit_external_food_blockers.py"
      - ".github/workflows/external-food-blocker-dossier.yml"
      - "tools/probe_cnf2026_schema.py"
      - "tools/recover_external_food_from_cnf2026.py"
      - "tools/recover_usda_legacy_from_cnf2026.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evidence-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify and load immutable 4E records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 37851579594 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = "success"
          mkdir -p .input
          gh run download 37851579594 --repo "$GITHUB_REPOSITORY" --name external-food-step4e-integrity --dir .input
          test -s .input/step4e_blocked_other.json
          test -s .input/step4e_state_blocked.json
      - name: Inventory all unresolved exact fields and sources
        run: |
          python3 tools/audit_external_food_blockers.py \
            --blocked .input/step4e_blocked_other.json \
            --state-blocked .input/step4e_state_blocked.json \
            --output .output
          cat .output/blocked56_inventory.md >> "$GITHUB_STEP_SUMMARY"
      - name: Probe official CNF 2026 dataset; evidence only
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --connect-timeout 15 --max-time 130 \
            -A 'nutrition-engine-science-audit/1.0 (+independent source verification)' \
            'https://open.canada.ca/data/dataset/1b6139bd-ed7e-4043-bc28-ff00e10f3109/resource/019f2a90-e3a9-489d-b6e1-f74f4ba1d006/download/cnf_fcen_all-files-data_2026.zip' \
            -o /tmp/cnf_fcen_2026.zip || { echo 'CNF_2026_HTTP_DOWNLOAD_UNAVAILABLE'; exit 0; }
          unzip -t /tmp/cnf_fcen_2026.zip >/dev/null || { echo 'CNF_2026_ZIP_INVALID'; exit 0; }
          python3 tools/probe_cnf2026_schema.py --zip /tmp/cnf_fcen_2026.zip \
            --blocked .input/step4e_blocked_other.json --output .output
          python3 tools/recover_external_food_from_cnf2026.py \
            --zip /tmp/cnf_fcen_2026.zip \
            --blocked .input/step4e_blocked_other.json --output .output
          curl -fL --retry 2 --connect-timeout 15 --max-time 130 \
            'https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_csv_2018-04.zip' \
            -o /tmp/usda_sr_legacy2018.zip || { echo 'FDC_SR_LEGACY_UNAVAILABLE'; exit 0; }
          unzip -t /tmp/usda_sr_legacy2018.zip >/dev/null || { echo 'FDC_SR_LEGACY_ZIP_INVALID'; exit 0; }
          python3 tools/recover_usda_legacy_from_cnf2026.py \
            --cnf-zip /tmp/cnf_fcen_2026.zip \
            --fdc-zip /tmp/usda_sr_legacy2018.zip \
            --blocked .input/step4e_blocked_other.json --output .output
      - uses: actions/upload-artifact@v4
        with:
          name: external-food-blocked56-science-ledger
          path: .output/
          retention-days: 21
          include-hidden-files: true
          if-no-files-found: error
