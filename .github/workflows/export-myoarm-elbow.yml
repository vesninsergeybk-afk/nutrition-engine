name: Export MyoArm elbow checkpoint

on:
  push:
    branches:
      - feature/muscle-memory-mvp
    paths:
      - experiments/muscle-memory-game/export-myoarm-elbow.py
      - experiments/muscle-memory-game/check-myoarm-elbow-file.mjs
      - .github/workflows/export-myoarm-elbow.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  elbow:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned MyoSim source
        run: |
          python -m pip install --disable-pip-version-check             "git+https://github.com/MyoHub/myo_sim.git@93b0ca8f4ec90c9899ee7f05fee561e9911da91b"

      - name: Export source-derived elbow and biceps paths
        run: |
          python experiments/muscle-memory-game/export-myoarm-elbow.py             --output /tmp/myoarm-elbow-flexion.json             --frames 121

      - name: Validate elbow checkpoint
        run: |
          node experiments/muscle-memory-game/check-myoarm-elbow-file.mjs             /tmp/myoarm-elbow-flexion.json

      - name: Vendor verified elbow runtime assets
        shell: bash
        run: |
          set -euo pipefail
          DEST=experiments/muscle-memory-game/assets/motion/myoarm/elbow
          mkdir -p "$DEST"
          cp /tmp/myoarm-elbow-flexion.json "$DEST/myoarm-elbow-flexion.json"

          python - <<'PY'
          from pathlib import Path
          import shutil
          import myo_sim

          dest = Path("experiments/muscle-memory-game/assets/motion/myoarm/elbow")
          mesh_root = Path(myo_sim.__file__).resolve().parent / "models" / "meshes"
          for name in ("humerus.stl", "ulna.stl", "radius.stl"):
              source = mesh_root / name
              if not source.is_file():
                  raise SystemExit(f"Missing pinned MyoArm mesh: {source}")
              shutil.copy2(source, dest / name)
          PY

          cat > "$DEST/SOURCE.md" <<'EOF'
          # MyoArm elbow Motion Lab runtime

          Source: MyoHub/myo_sim
          Revision: 93b0ca8f4ec90c9899ee7f05fee561e9911da91b

          myoarm-elbow-flexion.json is generated by export-myoarm-elbow.py
          from the pinned MuJoCo MyoArm model. It contains source-derived rigid
          body transforms and MuJoCo-computed BIClong/BICshort tendon wrapping
          segments for elbow flexion.

          humerus.stl, ulna.stl, and radius.stl are copied from the same pinned
          MyoArm package so motion and displayed bones share one source
          coordinate system.

          Repository source files declare Apache-2.0. Product use still retains
          the project's separate upstream provenance/licensing review gate.
          EOF

      - name: Commit verified runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/muscle-memory-game/assets/motion/myoarm/elbow
          if git diff --cached --quiet; then
            echo "Runtime assets already current"
            exit 0
          fi
          git commit -m "Vendor verified MyoArm elbow runtime assets [elbow-smoke]"
          git push origin "HEAD:\${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: myoarm-elbow-flexion
          path: /tmp/myoarm-elbow-flexion.json
          if-no-files-found: error
          retention-days: 30
