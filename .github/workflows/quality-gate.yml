name: Nutrition Calculator Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "Gate profile"
        required: true
        default: full
        type: choice
        options:
          - fast
          - core
          - browser
          - full

permissions:
  contents: read

concurrency:
  group: nutrition-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Iterative branch work stays intentionally light. Draft PRs get structural
  # feedback in seconds rather than launching four heavy jobs on every commit.
  # Marking the PR ready for review is the explicit release-candidate boundary:
  # it launches the canonical core + three-browser matrix below.
  fast-feedback:
    name: Fast draft feedback
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == true) ||
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'fast')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Create non-secret CI configuration
        run: |
          cp api/gemini-secret.example.php api/gemini-secret.php
          chmod 0644 api/gemini-secret.php

      - name: Run fast structural feedback
        run: python3 tools/ci_fast_gate_v6.py

      - name: Upload fast diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nutrition-fast-gate-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 5

  core-gate:
    name: Core and safety gate
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' && (inputs.profile == 'full' || inputs.profile == 'core'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Install core system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends php-cli curl

      - name: Create non-secret CI configuration
        run: |
          cp api/gemini-secret.example.php api/gemini-secret.php
          chmod 0644 api/gemini-secret.php

      - name: Run canonical V6 core and safety suites
        run: python3 tools/ci_core_gate_v6.py

      - name: Upload core reports on failure or manual audit
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nutrition-core-gate-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  browser-gate:
    name: Canonical V6 browser gate (${{ matrix.browser }})
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' && (inputs.profile == 'full' || inputs.profile == 'browser'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Install selected browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run current V6 browser contract
        run: |
          npx playwright test tests/e2e/v6-canonical-ci.spec.js \
            --project=${{ matrix.browser }} \
            --retries=1 \
            --timeout=90000 \
            --reporter=line

      - name: Capture empty-state repair audit
        if: matrix.browser == 'chromium'
        run: |
          npx playwright test tests/e2e/ui-audit-capture.spec.js \
            --project=chromium \
            --timeout=90000 \
            --reporter=line

      - name: Capture filled user journey
        if: matrix.browser == 'chromium'
        run: |
          python3 tools/ci_server.py --port 4173 > /tmp/empty-state-repair-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          node tools/real_run_smoke.cjs

      # Axe executes the same DOM rule engine in every browser. Chromium remains
      # the PR blocker; Firefox repeats the full accessibility matrix on main and
      # manual full/browser runs. WebKit keeps the obligatory functional contract.
      - name: Run WCAG accessibility gate
        if: >-
          matrix.browser == 'chromium' ||
          (matrix.browser == 'firefox' && github.event_name != 'pull_request')
        run: |
          npx playwright test tests/e2e/accessibility.spec.js \
            --project=${{ matrix.browser }} \
            --retries=1 \
            --timeout=90000 \
            --reporter=line

      # Chromium carries the intentional visual/real-run evidence. Successful
      # Firefox/WebKit jobs do not need multi-megabyte artifacts; upload those
      # only when they fail.
      - name: Upload browser diagnostics
        if: always() && (matrix.browser == 'chromium' || failure())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nutrition-browser-${{ matrix.browser }}-${{ github.sha }}
          path: |
            reports/playwright-artifacts/
            reports/playwright-results.json
            reports/playwright-html/
            reports/axe/
            reports/ui-audit/
            reports/real-run/
          if-no-files-found: warn
          retention-days: 7
