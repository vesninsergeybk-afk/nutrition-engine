name: Nutrition Calculator Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nutrition-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apache2 libapache2-mod-php php-cli curl python3 unzip

      - name: Create non-secret CI configuration
        run: |
          cp api/gemini-secret.example.php api/gemini-secret.php
          chmod 0644 api/gemini-secret.php

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run complete CI release gate
        run: python3 tools/release_gate.py --profile ci

      - name: Upload gate reports and deterministic candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nutrition-quality-gate-${{ github.sha }}
          path: |
            reports/
            release/
          if-no-files-found: error
          retention-days: 14
