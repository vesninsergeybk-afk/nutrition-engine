name: BodyParts3D shoulder HQ benchmark

on:
  push:
    branches:
      - feature/muscle-memory-mvp
    paths:
      - .github/workflows/bodyparts3d-shoulder-hq.yml
      - experiments/muscle-memory-game/benchmarks/bodyparts3d-3.0-95-shoulder.tsv

permissions:
  contents: read

jobs:
  build-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download shoulder high-polygon STL and previews
        shell: bash
        run: |
          set -euo pipefail
          LIST="experiments/muscle-memory-game/benchmarks/bodyparts3d-3.0-95-shoulder.tsv"
          OUT="/tmp/bodyparts3d-shoulder-hq"
          mkdir -p "$OUT/stl" "$OUT/png"

          tail -n +2 "$LIST" | while IFS=$'\t' read -r id name; do
            echo "==> $id $name"
            curl -fsSL --retry 3               "https://raw.githubusercontent.com/Kevin-Mattheus-Moerman/BodyParts3D/main/assets/BodyParts3D_data/stl/$id.stl"               -o "$OUT/stl/$id.stl"
            curl -fsSL --retry 3               "https://raw.githubusercontent.com/Kevin-Mattheus-Moerman/BodyParts3D/main/assets/BodyParts3D_data/png/$id.png"               -o "$OUT/png/$id.png"
          done

          cp "$LIST" "$OUT/structures.tsv"
          cp experiments/muscle-memory-game/THIRD_PARTY_NOTICES.md "$OUT/PROJECT_THIRD_PARTY_NOTICES.md"

          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"

          python3 -c 'import pathlib,sys; r=pathlib.Path(sys.argv[1]); s=list((r/"stl").glob("*.stl")); p=list((r/"png").glob("*.png")); print("STL count:",len(s)); print("PNG count:",len(p)); print("STL bytes:",sum(x.stat().st_size for x in s)); print("PNG bytes:",sum(x.stat().st_size for x in p)); assert len(s)==56 and len(p)==56, "Expected 56 STL and 56 PNG files"' "$OUT"

      - name: Upload shoulder benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: bodyparts3d-3.0-95-shoulder-hq
          path: /tmp/bodyparts3d-shoulder-hq/
          retention-days: 30
          compression-level: 6
