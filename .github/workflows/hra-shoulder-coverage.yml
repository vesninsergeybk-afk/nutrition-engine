name: HRA shoulder coverage audit

on:
  push:
    branches:
      - feature/muscle-memory-mvp
    paths:
      - .github/workflows/hra-shoulder-coverage.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Inspect shoulder-related node names in HRA united male
        shell: bash
        run: |
          set -euo pipefail
          FILE="/tmp/hra.glb"
          curl -fL --retry 3 --retry-delay 2             "https://cdn.humanatlas.io/digital-objects/ref-organ/united-male/v1.10/assets/3d-vh-m-united.glb"             -o "$FILE"

          python3 - "$FILE" <<'PY'
          import json, pathlib, re, struct, sys
          p = pathlib.Path(sys.argv[1])
          b = p.read_bytes()
          assert b[:4] == b"glTF"
          clen, ctype = struct.unpack_from("<II", b, 12)
          assert ctype == 0x4E4F534A
          data = json.loads(b[20:20+clen].decode("utf-8").rstrip("\x00 "))

          terms = [
              "deltoid", "supraspinatus", "infraspinatus", "subscapularis",
              "teres", "trapezius", "pectoralis", "latissimus", "biceps",
              "triceps", "serratus", "rhomboid", "levator scapulae",
              "coracobrachialis", "scapula", "clavicle", "humerus"
          ]

          names = []
          for kind in ("nodes", "meshes"):
              for item in data.get(kind, []):
                  name = str(item.get("name", ""))
                  if name:
                      names.append((kind, name))

          print("total_named_items=", len(names))
          for term in terms:
              found = sorted({name for kind, name in names if term.lower() in name.lower()})
              print(f"TERM {term}: {len(found)}")
              for name in found[:30]:
                  print("  ", name)
          PY
