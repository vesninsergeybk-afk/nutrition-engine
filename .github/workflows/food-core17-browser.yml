name: Food CORE17 browser acceptance

on:
  push:
    branches:
      - integration/food-pilot-core17-20261009
    paths:
      - ".github/workflows/food-core17-browser.yml"
      - "tests/e2e/external-food-core17.spec.js"
      - "data/products.external-food-core17.part-13.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: food-core17-browser-acceptance
  cancel-in-progress: true

jobs:
  chromium-real-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pilot revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Install locked packages
        run: npm ci --ignore-scripts
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run real UI search, ration, nutrients, HEI and persistence
        run: |
          npx playwright test tests/e2e/external-food-core17.spec.js \
            --project=chromium \
            --retries=0 \
            --timeout=90000 \
            --reporter=line
      - name: Upload evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: food-core17-browser-failures
          path: |
            reports/playwright-artifacts/
            reports/playwright-results.json
            reports/playwright-html/
            test-results/
          if-no-files-found: warn
          retention-days: 7
